name: Build D47Lona Android APK
on:
  push:
    branches: [main]
    paths:
      - 'd47lona/**'
      - '.github/workflows/d47lona-android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Create Capacitor Android shell
        run: |
          mkdir -p d47-android/www
          cp -R d47lona/. d47-android/www/
          cd d47-android
          npm init -y
          npm install --no-audit --no-fund @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          cat > capacitor.config.json <<'EOF'
          {"appId":"com.d47lona.loanmanager","appName":"D47Lona","webDir":"www","server":{"androidScheme":"https"}}
          EOF
          npx cap add android
      - name: Build unsigned release and installable debug APK
        working-directory: d47-android/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: D47Lona-Android-Debug-APK
          path: d47-android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
