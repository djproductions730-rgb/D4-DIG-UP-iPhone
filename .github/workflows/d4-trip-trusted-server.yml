name: D4 Trip Trusted Server — Milestone 05 Tests
on:
  push:
    branches: [feature/d4-trip-firebase-private-sync]
    paths:
      - 'd4-trip-demo/server-draft/**'
      - '.github/workflows/d4-trip-trusted-server.yml'
  pull_request:
    paths:
      - 'd4-trip-demo/server-draft/**'
      - '.github/workflows/d4-trip-trusted-server.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trusted-server-draft:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify server-side code syntax
        run: |
          node --check d4-trip-demo/server-draft/service.cjs
          node --check d4-trip-demo/server-draft/index.js
          node --check d4-trip-demo/server-draft/service.test.cjs
          node --check d4-trip-demo/server-draft/callable-auth.test.cjs
          node --test d4-trip-demo/server-draft/callable-auth.test.cjs
      - name: Install Firestore emulator and trusted Admin SDK
        run: npm install --no-save --no-audit --no-fund --package-lock=false firebase-admin@13.5.0 firebase-tools@15.30.1
      - name: Test invite, role, payment, and private chat transactions on emulator
        run: npx firebase emulators:exec --only firestore --project demo-d4-trip-server-qa --config d4-trip-demo/firebase.shared.qa.json "node d4-trip-demo/server-draft/service.test.cjs"
      - name: Confirm production Firebase rules remain private-only
        run: |
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('d4-trip-demo/firebase.json'));if(x.firestore.rules!=='firestore.rules')throw Error('Unsafe draft deployment attempt')"
