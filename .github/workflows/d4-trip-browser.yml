name: D4 Trip Chromium UI Smoke
on:
  push:
    branches: [feature/d4-trip-firebase-private-sync]
    paths:
      - 'd4-trip-demo/**'
      - '.github/workflows/d4-trip-browser.yml'
  pull_request:
    paths:
      - 'd4-trip-demo/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run payment, membership and sync regression checks
        run: node d4-trip-demo/check.cjs
      - name: Install Chromium test runner
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run local browser smoke checks (desktop and mobile)
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory d4-trip-demo > /tmp/d4-trip-smoke-http.log 2>&1 &
          sleep 2
          D4_BROWSER=${{ matrix.browser }} node d4-trip-demo/browser-smoke.cjs
      - name: Upload cinematic preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d4-trip-premium-${{ matrix.browser }}
          path: d4-trip-demo/preview/*.png
          if-no-files-found: ignore
          retention-days: 14
