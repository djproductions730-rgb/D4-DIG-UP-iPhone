name: D4 Trip Option 1 icon assets
on:
  push:
    branches: [dev/d4-trip-live-premium-20261105]
    paths:
      - 'd4-trip-demo/icon.svg'
      - 'd4-trip-demo/scripts/export-icon.py'
      - '.github/workflows/d4-trip-icon-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/d4-trip-live-premium-20261105
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install icon render tools
        run: python -m pip install --quiet cairosvg pillow
      - name: Export iPhone and Android PNGs
        run: python d4-trip-demo/scripts/export-icon.py
      - name: Commit icon PNGs on development branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add d4-trip-demo/apple-touch-icon-v28.png d4-trip-demo/icon-192-v28.png d4-trip-demo/icon-512-v28.png d4-trip-demo/icon-maskable-v28.png
          if ! git diff --cached --quiet; then
            git commit -m "assets(d4-trip): render Option 1 PNG icons"
            git push origin HEAD:dev/d4-trip-live-premium-20261105
          fi
