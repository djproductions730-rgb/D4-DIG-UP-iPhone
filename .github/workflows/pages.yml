name: Publish D4 DIG UP iPhone
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/configure-pages@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stamp DIG UP update version and asset URLs
        run: python tools/stamp-update.py
      - name: Render iPhone app icon PNG
        run: |
          python -m pip install --quiet cairosvg
          python -c "import cairosvg; cairosvg.svg2png(url='icon.svg',write_to='apple-touch-icon.png',output_width=180,output_height=180)"
          python -c "import cairosvg; cairosvg.svg2png(url='d47lona/icon.svg',write_to='d47lona/icon-192.png',output_width=192,output_height=192)"
          python -c "import cairosvg; cairosvg.svg2png(url='d47lona/icon.svg',write_to='d47lona/icon-512.png',output_width=512,output_height=512)"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Wait for the Pages artifact to be listed
        uses: actions/github-script@v7
        env:
          PAGES_ARTIFACT: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        with:
          script: |
            const artifactName = process.env.PAGES_ARTIFACT;
            for (let attempt = 0; attempt < 15; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRunArtifacts({
                ...context.repo, run_id: context.runId, name: artifactName
              });
              if (data.artifacts.some(artifact => artifact.name === artifactName)) return;
              await new Promise(resolve => setTimeout(resolve, 3000));
            }
            core.setFailed(`Pages artifact ${artifactName} did not appear in the Actions API.`);
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
