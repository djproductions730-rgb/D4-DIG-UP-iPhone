name: Publish D4 DIG UP iPhone
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Render iPhone app icon PNG
        run: |
          python3 -m pip install --quiet --user cairosvg
          python3 -c "import cairosvg; cairosvg.svg2png(url='icon.svg',write_to='apple-touch-icon.png',output_width=180,output_height=180)"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
