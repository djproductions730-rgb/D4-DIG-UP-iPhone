name: D4 Trip Shared Membership — Draft Security Tests
on:
  push:
    branches: [feature/d4-trip-firebase-private-sync]
    paths:
      - 'd4-trip-demo/firestore.shared.draft.rules'
      - 'd4-trip-demo/firestore.shared.draft.test.cjs'
      - 'd4-trip-demo/firebase.shared.qa.json'
      - '.github/workflows/d4-trip-shared-security.yml'
  pull_request:
    paths:
      - 'd4-trip-demo/firestore.shared.draft.rules'
      - 'd4-trip-demo/firestore.shared.draft.test.cjs'
      - 'd4-trip-demo/firebase.shared.qa.json'
      - '.github/workflows/d4-trip-shared-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shared-security-draft:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install local Firebase rules-test environment
        run: npm install --no-audit --no-fund --no-save --package-lock=false firebase@13.1.0 @firebase/rules-unit-testing@6.0.0 firebase-tools@15.30.1
      - name: Validate undeployed shared trip permissions in emulator
        run: npx firebase emulators:exec --only firestore --project demo-d4-trip-shared-qa --config d4-trip-demo/firebase.shared.qa.json "node d4-trip-demo/firestore.shared.draft.test.cjs"
      - name: Verify production deployment still references private-only rules
        run: |
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('d4-trip-demo/firebase.json','utf8')); if(p.firestore.rules!=='firestore.rules') throw Error('Shared draft may not be deployed')"
