name: D4 Trip live v40 read-only UI diagnosis
on:
  push:
    branches: [dev/d4-trip-join-requests-section-20261107]
    paths: ['.github/workflows/d4-trip-live-v40-probe.yml']
  workflow_dispatch:

permissions:
  contents: read
jobs:
  live-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Diagnose live premium assets and actual render, read-only
        run: node d4-trip-demo/live-v40-probe.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-v40-screenshot
          path: live-probe.png
          if-no-files-found: ignore
          retention-days: 3
