html[data-theme="midnight"]{

  --theme-border:#365F80;--theme-hero:#0D3F63;--theme-primary:#2468C2;

  <script>(() => {
'use strict';

const icons={home:'home',loans:'wallet',schedule:'calendar',reminders:'bell',settings:'settings',add:'plus',check:'check',phone:'phone',calendar:'calendar',wallet:'wallet',rupee:'rupee',chart:'chart',eye:'eye',eyeoff:'eyeoff',back:'back',right:'chevron',clock:'clock',edit:'pencil',download:'download',upload:'upload',info:'info',refresh:'refresh',shield:'shield',close:'x',trash:'trash'};

const safe=s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2,minimumFractionDigits:(n%1?2:0)});
const fmtDate=s=>{if(!s)return 'Set date';const d=new Date(s+'T12:00:00Z');return `${String(d.getUTCDate()).padStart(2,'0')} ${MONTHS[d.getUTCMonth()]} ${d.getUTCFullYear()}`};
const iso=(y,m,d)=>`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
const datePlusMonths=(base,i)=>{if(!base)return '';const [y,m,d]=base.split('-').map(Number);let total=y*12+(m-1)+i;let yy=Math.floor(total/12),mm=total%12+1;return iso(yy,mm,Math.min(d,new Date(Date.UTC(yy,mm,0)).getUTCDate()))};
const today=()=>{let d=new Date();return iso(d.getFullYear(),d.getMonth()+1,d.getDate())};
const diffDays=(a,b)=>Math.round((new Date(a+'T12:00:00Z')-new Date(b+'T12:00:00Z'))/86400000);
function fresh(){return {version:1,createdAt:today(),theme:'crystal',introStyle:'crystal',hideMoney:false,salary:0,salaries:{},digupSalarySnapshots:{},digupBackupMeta:null,reminderDays:3,reminderOnDue:true,reminderAfterDue:false,banks:[{id:'hdfc',name:'HDFC Bank',balance:0,reserved:false,note:'Manual balance'},{id:'axis',name:'Axis Bank',balance:0,reserved:false,note:'Manual balance'}],loans:[],ledger:[]}};
function load(){try{let v=JSON.parse(localStorage.getItem(STORE));if(v&&v.version===1&&Array.isArray(v.loans)&&Array.isArray(v.banks)&&Array.isArray(v.ledger)){
 if(!v.salaries||typeof v.salaries!=='object'||Array.isArray(v.salaries))v.salaries={};
 if(!v.digupSalarySnapshots||typeof v.digupSalarySnapshots!=='object'||Array.isArray(v.digupSalarySnapshots))v.digupSalarySnapshots={};
 // Keep the previous general salary estimate separate: it is not proof of income for this specific month.

 }}catch(e){}return fresh()}
let state=load();let salarySelectedMonth=today().slice(0,7);let view='home',detailId=null,filter='active',cycleFilter='all',cyclePage=2,modal=null,calYear=new Date().getFullYear(),calMonth=new Date().getMonth(),toastTimeout=null;

const D4_LOCAL_KEY='d4webv15';
const D4_CLOUD_COPY_KEY='d47lona-digup-cloud-copy';
const digUpHost=window.parent!==window&&new URLSearchParams(location.search).get('embedded')==='1'

 const valid=x=>x&&Array.isArray(x.banks)&&Array.isArray(x.entries);
 // The Lona iPhone PWA can hold an old local DIG UP import. A successful

 if(!digUpHost&&localStorage.getItem('d4-pair-link-v1')&&valid(cloud))return cloud;

function d4Match(d,b){

   return d.banks.find(x=>String(x.id)===String(b.digupBankId))||null;
 }
 const norm=x=>String(x||'').toLowerCase().replace(/bank|ltd|limited/g,'').replace(/[^a-z0-9]/g,'');
 const matches=d.banks.filter(x=>norm(x.name)===norm(b.name)&&!/pluxee/i.test(x.name||''));

function d47SyncState(){

   const incoming=local.banks.filter(b=>b&&typeof b.name==='string'&&!/pluxee/i.test(b.name)&&Number.isFinite(Number(b.balance)));
   const matched=incoming.filter(db=>state.banks.some(b=>b.digupBankId!=null&&String(b.digupBankId)===String(db.id)&&Math.abs(Number(b.balance)-Number(db.balance))<0.005)).length;
   const complete=matched===incoming.length;

     color:complete?'linked':'backup'};
 }
 if(localStorage.getItem('d4-pair-link-v1')){
   const x=window.__d47PairState;
   if(x&&!x.error&&/Synced · DIG UP changes received/i.test(x.status))return {state:'linked',label:'Auto-sync on',description:x.status,color:'linked'};

   return {state:'local',label:'Paired · connecting',description:x?.status||'Waiting for encrypted cloud sync',color:'backup'};
 }
 if(d4CloudCopyEnabled())return {state:'local',label:'Cloud sync',description:'Tap Sync to check the DigUp cloud connection.',color:'local'};
 const d=d4Store();
 if(d)return {state:'linked',label:'Local link',description:'Same-browser records. Tap Sync for Finance Auto-sync status.',color:'local'};
 if(state.digupBackupMeta)return {state:'backup',label:'Backup copy',description:'Import a new DIG UP backup to update',color:'backup'};

function syncLocalBalances(){
 const d=d4Store();if(!d)return false;
 let changed=false;
 const normalized=x=>String(x||'').toLowerCase().replace(/bank|ltd|limited/g,'').replace(/[^a-z0-9]/g,'');
 const linked=new Set(state.banks.filter(b=>b.digupBankId!=null).map(b=>String(b.digupBankId)));
 const incoming=d.banks.filter(x=>x&&typeof x.name==='string'&&!/pluxee/i.test(x.name)&&Number.isFinite(Number(x.balance)));
 const normalizeBankId=id=>String(id||'').replace(/[^a-z0-9_-]/gi,'').slice(0,65);
 for(const db of incoming){
   const ref=String(db.id);if(!ref)continue;
   let existing=state.banks.find(x=>x.digupBankId!=null&&String(x.digupBankId)===ref);
   if(!existing){
     const candidates=state.banks.filter(x=>x.digupBankId==null&&normalized(x.name)===normalized(db.name));
     const uniqueName=incoming.filter(x=>normalized(x.name)===normalized(db.name)).length===1;
     if(uniqueName&&candidates.length===1)existing=candidates[0];
     else{
       // A brand-new, unused zero-balance bank placeholder can safely be
       // attached to the first same-named DIG UP account. Never repurpose a
       // bank referenced by a loan or payment, or with a manual balance.
       existing=candidates.find(x=>Number(x.balance)===0
         &&(!x.note||x.note==='Manual balance')
         &&!state.loans.some(l=>String(l.bankId)===String(x.id))
         &&!state.ledger.some(e=>String(e.bankId)===String(x.id)));
     }
   }
   if(!existing){
     const base='digup-'+normalizeBankId(ref);
     let id=base,n=1;while(state.banks.some(x=>x.id===id))id=base+'-'+n++;
     existing={id,name:db.name,balance:Number(db.balance),reserved:false,note:'Linked DIG UP account',digupBankId:ref};
     state.banks.push(existing);changed=true
   }else{
     if(existing.digupBankId!==ref){existing.digupBankId=ref;changed=true}
     if(existing.name!==db.name){existing.name=db.name;changed=true}
     if(Number(existing.balance)!==Number(db.balance)){existing.balance=Number(db.balance);changed=true}
     if(existing.digupInactive){delete existing.digupInactive;changed=true}
   }
   linked.add(ref)
 }
 // Retain removed bank records referenced by past EMI payments, but clearly
 // distinguish them from active DIG UP accounts instead of deleting history.
 for(const b of state.banks){
  if(b.digupBankId==null)continue;
  const missing=!incoming.some(x=>String(x.id)===String(b.digupBankId));
  if(Boolean(b.digupInactive)!==missing){b.digupInactive=missing;changed=true}
 }
 if(syncDigupLoans(d))changed=true;
 if(changed)save();
 return true
}
// DIG UP loans are not in Lona's native schema: DIG UP stores months/payments,
// while Lona uses tenure/paid cycles. Translate source fields for display.
function syncDigupLoans(d){
 if(!Array.isArray(d?.loans))return false;
 let changed=false;
 const ids=new Set();
 const norm=x=>String(x||'').trim().toLowerCase().replace(/\s+/g,' ');
 for(const src of d.loans){
  if(!src||src.id==null||!String(src.id).trim()||!String(src.name||'').trim())continue;
  const externalId=String(src.id),tenure=Number(src.months),principal=Number(src.principal),rate=Math.max(0,Number(src.annualRate)||0)/1200;
  if(!Number.isInteger(tenure)||tenure<1||tenure>480)continue;
  let emi=Number(src.emi);
  if(!(emi>0)&&Number.isFinite(principal)&&principal>0)
   emi=rate?principal*rate/(1-Math.pow(1+rate,-tenure)):principal/tenure;
  if(!Number.isFinite(emi)||emi<=0)continue;
  emi=Math.round(emi*100)/100;if(!(emi>0))continue;
  ids.add(externalId);
  const defaultId='digup-'+Array.from(externalId,c=>c.codePointAt(0).toString(16).padStart(4,'0')).join('');
  let loan=state.loans.find(x=>x.digupLoanId===externalId);
  if(!loan){
   const candidates=state.loans.filter(x=>!x.digupLinked&&(!x.paid||x.paid.length===0)
     &&norm(x.name)===norm(src.name)&&Number(x.tenure)===tenure
     &&Math.abs(Number(x.emi)-emi)<0.01
     &&(!x.firstDue||!src.firstDue||String(x.firstDue).slice(0,10)===String(src.firstDue).slice(0,10)));
   if(candidates.length===1)loan=candidates[0];
  }
  if(!loan){loan={id:defaultId,paid:[]};state.loans.push(loan);changed=true}
  const db=src.bank?d.banks.find(b=>norm(b.name)===norm(src.bank)):null;
  const bank=db?state.banks.find(b=>String(b.digupBankId)===String(db.id)):null;
  const payments=(Array.isArray(src.payments)?src.payments:[])
    .filter(p=>p&&/^\d{4}-\d{2}-\d{2}$/.test(String(p.date||'').slice(0,10))
      &&Number.isFinite(Number(p.amount))&&Number(p.amount)>0)
    .slice().sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  const paid=[];let sum=0;
  for(const p of payments){
   sum+=Number(p.amount);
   while(paid.length<tenure&&sum+0.009>=emi*(paid.length+1)){
    const b=state.banks.find(x=>String(x.digupBankId)===String(p.bankId));
    paid.push({cycle:paid.length+1,date:String(p.date).slice(0,10),amount:emi,
      bankId:b?.id||bank?.id||loan.bankId||'',deducted:false,origin:'digup-linked'});
   }
  }
  const freshLoan={
   digupLoanId:externalId,digupLinked:true,
   name:String(src.name).slice(0,60),lender:String(src.lender||src.bank||'').slice(0,80),
   kind:src.kind||loan.kind||'personal',bankId:bank?.id||(Object.hasOwn(src,'bank')?'':loan.bankId||''),
   credited:Object.hasOwn(src,'credited')?src.credited:loan.credited??null,
   principal:Number.isFinite(principal)&&principal>0?principal:null,
   emi,tenure,
   firstDue:/^\d{4}-\d{2}-\d{2}$/.test(String(src.firstDue||'').slice(0,10))
     ?String(src.firstDue).slice(0,10):'',
   source:'DIG UP auto-sync',paid
  };
  if(loan.pdfScheduleId==='HDFC-172144641-20261122'){
   freshLoan.principal=260000;freshLoan.emi=5916;freshLoan.tenure=60;freshLoan.firstDue='2026-12-07';
  }
  for(const [key,value] of Object.entries(freshLoan))
   if(JSON.stringify(loan[key])!==JSON.stringify(value)){loan[key]=value;changed=true}
 }

}
function d4SyncStats(){
 const d=d4Store();if(!d)return {connected:false,banks:0,linked:0,transactions:state.digupBackupMeta?.entryCount||0,snapshot:!!state.digupBackupMeta};
 return {connected:true,banks:d.banks.filter(x=>!/pluxee/i.test(x.name||'')).length,

/* D47Lona restore v2: accepts exported app backups, earlier direct state snapshots,
   and routes a DIG UP backup to its own safe import path. Never commits data on parse failure. */
function restoreFromJson(parsed){
 if(!parsed||typeof parsed!=='object'||Array.isArray(parsed))throw Error('JSON file must contain a backup object');
 // Distinguish DIG UP from D47Lona before validating the loan schema.
 if(parsed.format==='d4webv15'){
   if(!Array.isArray(parsed.banks)||!Array.isArray(parsed.entries))throw Error('DIG UP backup needs banks and entries arrays');
   if(parsed.banks.length>200||parsed.entries.length>150000)throw Error('DIG UP backup is too large');
   if(!parsed.banks.length&&!parsed.entries.length)throw Error('DIG UP backup is empty');
   if(parsed.banks.some(x=>!x||typeof x.name!=='string'||!Number.isFinite(Number(x.balance))))throw Error('DIG UP backup contains invalid bank values');
   const linked=d4Store();
   if(linked&&(linked.banks.length||linked.entries.length)){
     syncLocalBalances();render();
     return 'DIG UP records already exist in this browser. Nothing overwritten. Open Settings → Sync Now.';
   }
   if(!confirm('This is a DIG UP backup, not a D47Lona loan backup. Import '+parsed.banks.length+' banks and '+parsed.entries.length+' transactions for same-browser bank sync?'))return 'Import cancelled';
   digUpStorage.setItem(D4_LOCAL_KEY,JSON.stringify(parsed));
   syncLocalBalances();render();
   return 'DIG UP backup imported. Check bank details.';
 }
 // Some previous D47Lona exports wrap state in data; some snapshots are direct.
 const inner=parsed.app==='D47Lona'&&parsed.data?parsed.data:
   parsed.data&&Array.isArray(parsed.data.loans)?parsed.data:parsed;
 if(!inner||!Array.isArray(inner.loans)||!Array.isArray(inner.banks))
   throw Error('This is not a D47Lona loan backup. Choose D47Lona-PRIVATE-Loan-Data.json or an exported D47Lona backup.');
 if(inner.loans.length>500||inner.banks.length>200)throw Error('Backup contains too many loans or banks');
 const seenBank=new Set();
 const banks=inner.banks.map((b,i)=>{
   if(!b||typeof b!=='object'||typeof b.id!=='string'||!String(b.id).trim()||typeof b.name!=='string'||!b.name.trim())throw Error('Bank '+(i+1)+' has missing ID or name');
   if(seenBank.has(b.id))throw Error('Duplicate bank ID in backup');seenBank.add(b.id);
   if(!Number.isFinite(Number(b.balance)))throw Error('Bank '+(i+1)+' has invalid balance');
   return {...b,balance:Number(b.balance),reserved:!!b.reserved}
 });
 const seenLoan=new Set();
 const loans=inner.loans.map((loan,i)=>{
   if(!loan||typeof loan!=='object'||!String(loan.id||'').trim()||typeof loan.name!=='string')throw Error('Loan '+(i+1)+' has missing ID or name');
   if(seenLoan.has(loan.id))throw Error('Duplicate loan ID in backup');seenLoan.add(loan.id);
   const tenure=Number(loan.tenure),emi=Number(loan.emi);
   if(!Number.isInteger(tenure)||tenure<1||tenure>480||!Number.isFinite(emi)||emi<0)throw Error('Loan '+(i+1)+' has invalid EMI or tenure');
   const paid=Array.isArray(loan.paid)?loan.paid:[];
   if(paid.length>tenure||paid.some(p=>!p||!Number.isInteger(Number(p.cycle))||Number(p.cycle)<1||Number(p.cycle)>tenure))throw Error('Loan '+(i+1)+' has an invalid paid-EMI history');
   if(loan.schedule!==undefined&&(!Array.isArray(loan.schedule)||loan.schedule.length>tenure))throw Error('Loan '+(i+1)+' has an invalid EMI schedule');
   return {...loan,tenure,emi,paid};
 });
 if(inner.ledger!==undefined&&!Array.isArray(inner.ledger))throw Error('Payment ledger must be a list');
 const ledger=inner.ledger||[];
 if(ledger.length>100000)throw Error('Payment history is too large');
 const candidate={
   ...fresh(),
   ...inner,
   version:1,
   theme:['crystal','midnight','emerald','royal','gold'].includes(inner.theme)?inner.theme:'crystal',
   introStyle:['crystal','emi','vault'].includes(inner.introStyle)?inner.introStyle:'crystal',
   banks,loans,ledger
 };
 if(!confirm('Valid D47Lona backup found: '+loans.length+' loan(s), '+banks.length+' bank(s), '+ledger.length+' ledger entries. Restore it? A local recovery copy of your current data will be kept first.'))return 'Restore cancelled';
 const old=localStorage.getItem(STORE);
 // Atomic checks: verify and save before changing the in-memory application.
 if(old!==null)localStorage.setItem(STORE+'-before-restore',old);
 localStorage.setItem(STORE,JSON.stringify(candidate));
 state=candidate;
 syncLocalBalances();
 modal=null;goto('home');
 return 'D47Lona backup restored: '+loans.length+' loan(s), '+banks.length+' bank(s).';
}
function chooseRestoreJson(){
 const input=document.createElement('input');input.type='file';input.accept='.json,application/json';
 input.onchange=async()=>{
   const file=input.files?.[0];if(!file)return;
   try{
     if(file.size>8*1024*1024)throw Error('File exceeds 8 MB. Choose the original JSON backup');
     const raw=(await file.text()).replace(/^\uFEFF/,'').trim();
     if(!raw)throw Error('Selected file is empty');
     let parsed;
     try{parsed=JSON.parse(raw)}
     catch(e){throw Error('File is not valid JSON. Download a complete .json backup (not a screenshot or PDF).')}
     notify(restoreFromJson(parsed))
   }catch(e){notify('Restore failed: '+String(e.message||e));console.warn('D47Lona backup validation:',String(e.message||e))}
 };
 input.click();
}

/* Import an updated DIG UP export into Lona only. Do NOT overwrite DIG UP's own
   localStorage, since that could destroy newer transactions in its live browser. */
function d4ImportBackup(){
 const input=document.createElement('input');input.type='file';input.accept='.json,application/json';
 input.onchange=async()=>{
  const f=input.files?.[0];if(!f)return;
  try{
   if(f.size>8*1024*1024)throw Error('File exceeds 8 MB');
   const source=JSON.parse((await f.text()).replace(/^\uFEFF/,''));
   if(source.format!=='d4webv15'||!Array.isArray(source.banks)||!Array.isArray(source.entries))
     throw Error('Choose a D4 DIG UP exported backup JSON');
   if(source.banks.length>200||source.entries.length>150000||(!source.banks.length&&!source.entries.length))
     throw Error('Backup is empty or unexpectedly large');
   if(source.banks.some(b=>!b||typeof b.id==='undefined'||typeof b.name!=='string'||!Number.isFinite(Number(b.balance))))
     throw Error('Backup has invalid bank entries');
   const live=d4Store();
   const text='Update D47Lona with '+source.banks.length+' bank balance(s) and Salary income entries from this DIG UP backup? DIG UP itself will NOT be changed. Existing Lona loan payments are preserved.';
   if(!confirm(text))return;
   // Precompute before modifying state so invalid rows never cause partial imports.
   const snapshots={};
   for(const e of source.entries){
    if(!e||String(e.type||'').trim().toLowerCase()!=='income'||String(e.category||'').trim().toLowerCase()!=='salary')continue;
    const ym=String(e.created||e.date||e.when||'').slice(0,7);
    const amount=Number(e.amount);
    if(!validSalaryMonth(ym)||!Number.isFinite(amount)||amount<=0)continue;
    (snapshots[ym]??={entries:[]}).entries.push({type:'Income',category:'Salary',created:ym+'-01',amount});
   }
   const copy=JSON.parse(JSON.stringify(state));
   const norm=name=>String(name||'').toLowerCase().replace(/bank|ltd|limited/g,'').replace(/[^a-z0-9]/g,'');
   for(const db of source.banks){
    if(/pluxee/i.test(db.name)||!String(db.name).trim())continue;
    const name=norm(db.name);
    let existing=copy.banks.find(x=>norm(x.name)===name);
    // If DIG UP is actually open in this browser, use its live balance, not a stale file.
    const liveBank=live?.banks.find(x=>norm(x.name)===name);
    const balance=Number(liveBank?liveBank.balance:db.balance);
    if(existing)existing.balance=balance;
    else{
     const id='backup-'+String(db.id).replace(/[^a-z0-9_-]/gi,'').slice(0,65);
     copy.banks.push({id,name:db.name,balance,reserved:false,note:'DIG UP backup · not live bank sync'});
    }
   }
   copy.digupSalarySnapshots=snapshots;
   copy.digupBackupMeta={importedAt:new Date().toISOString(),bankCount:source.banks.length,entryCount:source.entries.length};
   const previous=localStorage.getItem(STORE);
   if(previous!==null)localStorage.setItem(STORE+'-before-digup-import',previous);
   localStorage.setItem(STORE,JSON.stringify(copy));
   state=copy;
   syncLocalBalances();render();
   notify(live?'Bank balances linked · salary backup refreshed':'DIG UP backup refreshed · re-import after future changes');
  }catch(error){notify('DIG UP import failed: '+String(error.message||error))}
 };
 input.click()
}

function recordD4Emi(loan,cycle,bank,amount,paidDate){
 // Only the actual local DIG UP ledger can be safely modified. A cloud-copy
 // snapshot must never receive an unconfirmed EMI charge.
 if(!digUpStorage.getItem(D4_LOCAL_KEY))return {linked:false};
 const d=d4Store();if(!d)return {linked:false};
 const db=d4Match(d,bank);if(!db)return {linked:false};
 const id='d47lona:emi:'+loan.id+':'+cycle;
 const found=d.entries.find(e=>String(e.id)===id);
 if(found)return {linked:true,id,balance:Number(db.balance)};
 const before=Number(db.balance)||0,after=Math.round((before-amount)*100)/100;
 if(after<0&&!confirm('D4 DIG UP bank balance will become negative. Record this EMI anyway?'))return {cancelled:true};
 db.balance=after;
 d.entries.push({id,bankId:db.id,bank:db.name,type:'Expense',category:'Bills',amount,note:loan.name+' EMI · '+cycle+'/'+loan.tenure,created:paidDate+'T12:00:00+05:30',balanceBefore:before,balanceAfter:after,loanId:loan.id,emiCycle:cycle,source:'D47Lona'});
 try{digUpStorage.setItem(D4_LOCAL_KEY,JSON.stringify(d))}catch(_){return {cancelled:true}}
 return {linked:true,id,balance:after}
}
function undoD4Emi(payment,bank){
 if(!digUpStorage.getItem(D4_LOCAL_KEY))return false;
 const d=d4Store();if(!d||!payment.d4Id)return false;
 const index=d.entries.findIndex(e=>String(e.id)===payment.d4Id);
 if(index<0)return false;
 const entry=d.entries[index],db=d.banks.find(b=>String(b.id)===String(entry.bankId));
 if(!db)return false;
 db.balance=Math.round((Number(db.balance)+Number(payment.amount))*100)/100;
 d.entries.splice(index,1);
 digUpStorage.setItem(D4_LOCAL_KEY,JSON.stringify(d));
 if(bank)bank.balance=db.balance;
 return true
}

   Import is explicit; never auto-charge EMI or create a duplicate loan. */
const HDFC_172144641_PRINCIPALS=[3099,3133,3167,3201,3236,3271,3306,3342,3378,3415,3452,3489,3527,3565,3604,3643,3682,3722,3762,3803,3844,3886,3928,3971,4014,4057,4101,4146,4191,4236,4282,4328,4375,4423,4470,4519,4568,4617,4667,4718,4769,4821,4873,4926,4979,5033,5088,5143,5198,5255,5312,5369,5427,5486,5546,5606,5666,5728,5790,5847];
function hdfc172144641Schedule(){
 let remaining=260000;
 return HDFC_172144641_PRINCIPALS.map((principal,i)=>{
  const emi=i===0?4695:i===59?5910:5916;
  remaining-=principal;
  return {emi,principal,interest:emi-principal,principalLeft:remaining};
 });

function importHdfc172144641(){
 const loan=selectedLoan();
 if(!loan||!/home/i.test(loan.name||'')||!/hdfc/i.test(loan.lender||loan.name||'')){

 const target=state.loans.find(x=>x.id===loan.id);

}

function cycles(loan){if(!loan.firstDue)return [];return Array.from({length:loan.tenure},(_,i)=>({num:i+1,date:datePlusMonths(loan.firstDue,i),amount:amountFor(loan,i+1),paid:loan.paid.find(x=>x.cycle===i+1),principalLeft:loan.schedule?.[i]?.principalLeft??null,interest:loan.schedule?.[i]?.interest??null}))}

/* Month-specific salary journal. An unentered month is unknown, not a zero salary. */
function validSalaryMonth(month){return typeof month==='string'&&/^(19|20|21)\d{2}-(0[1-9]|1[0-2])$/.test(month)}
function salaryMap(){return state.salaries&&typeof state.salaries==='object'&&!Array.isArray(state.salaries)?state.salaries:{}}
function salaryRecord(month){return Object.prototype.hasOwnProperty.call(salaryMap(),month)?salaryMap()[month]:null}
function digupIncomeForMonth(month){
 if(!validSalaryMonth(month))return null;
 const linked=d4Store();
 const entries=linked?.entries||state.digupSalarySnapshots?.[month]?.entries||[];
 let total=0,count=0;
 for(const e of entries){
  if(!e||String(e.type||'').toLowerCase()!=='income'||String(e.category||'').trim().toLowerCase()!=='salary')continue;
  const time=String(e.created||e.date||e.when||'');
  if(time.slice(0,7)!==month)continue;
  const amount=Number(e.amount);
  if(!Number.isFinite(amount)||amount<=0)continue;
  total+=amount;count++;
 }
 if(!count)return null;
 return Math.round(total*100)/100;
}
function salaryAmount(month){
 const row=salaryRecord(month);
 if(row===null)return digupIncomeForMonth(month);
 const raw=typeof row==='number'?row:row?.amount;
 const n=Number(raw);return Number.isFinite(n)&&n>=0?n:null;
}
function monthName(ym){
 if(!validSalaryMonth(ym))return 'Unknown month';
 const [y,m]=ym.split('-').map(Number);return MONTHS[m-1]+' '+y
}
function scheduledEmiForMonth(ym){
 if(!validSalaryMonth(ym))return 0;
 return state.loans.reduce((total,loan)=>total+cycles(loan).filter(c=>c.date.slice(0,7)===ym).reduce((sum,c)=>sum+Number(c.amount||0),0),0)
}
function salaryMonthlyStats(ym){
 const salary=salaryAmount(ym),emi=scheduledEmiForMonth(ym),after=salary===null?null:salary-emi;
 const percent=salary!==null&&salary>0?emi/salary*100:null;
 return {month:ym,salary,emi,after,percent,missingDue:state.loans.some(l=>!l.firstDue)}
}

  +'<div class="field"><label for="salary-note">Note (optional)</label><input id="salary-note" name="note" maxlength="100" placeholder="Salary, bonus or adjustment" value="'+safe(typeof selected==='object'&&selected?.note?selected.note:'')+'"></div>'

  +(stats.missingDue?'<p class="footnote">A loan without its first EMI date is excluded from that month’s due total.</p>':'')

function loanDisplayKind(loan) {
 const words = String(loan.name ?? '').normalize('NFKC').toLowerCase().match(/[\p{L}\p{M}]+/gu) ?? [];
 const keyword = words.find(word => Object.hasOwn(loanNameKinds, word));
 if(keyword)return loanNameKinds[keyword];
 const kind = String(loan.kind ?? '').trim().toLowerCase();
 return Object.hasOwn(loanArtwork, kind) ? kind : 'other';
}
function loanIcon(loan) {
 const image = loanArtwork[loanDisplayKind(loan)];
 return `<div class="loan-icon loan-icon-illustrated"><img class="loan-art" src="${image}" alt="" width="128" height="128" loading="lazy" decoding="async"></div>`;
}
function loanCard(l,compact=false){
 const p=paidCount(l),total=Number(l.tenure)||1,percent=Math.min(100,Math.max(0,Math.round(p/total*100)));
 const tone=loanDisplayKind(l);
 const finished=p>=total;
 return `<article class="glass loan-compact loan-tone-${tone}">
  <div class="loan-compact-head">
   ${loanIcon(l)}
   <div class="loan-compact-head-copy"><strong>${safe(l.name)}</strong><small>${safe(l.lender||'Loan')}</small></div>
   <span class="loan-compact-status ${finished?'closed':''}">${finished?'Closed':'Active'}</span>

  <div class="loan-compact-actions"><span class="small">${percent}% completed</span><button type="button" class="loan-compact-open" data-open-loan="${safe(l.id)}">View Details ${ico('right')}</button></div>
 </article>`
}

function d47BankLogo(b){
 const name=String(b.name||'Bank'),key=name.trim().toLowerCase();
 const src=D47_BANK_LOGOS[key]||D47_BANK_LOGOS[key.replace(/ +(?:ltd|limited)\.?$/,'')]||'';
 const initials=name.split(/\s+/).filter(w=>!['bank','of','india','the'].includes(w.toLowerCase())).map(w=>w[0]).join('').slice(0,3).toUpperCase()||'B';
 return '<span class="bank-brand bank-icon" aria-hidden="true">'+(src?'<img src="'+safe(src)+'" alt="" loading="lazy"><span class="bank-logo-fallback" hidden>'+safe(initials)+'</span>':'<span class="bank-logo-fallback">'+safe(initials)+'</span>')+'</span>';
}
function bankDetailModal(id){
 const b=state.banks.find(x=>String(x.id)===String(id));if(!b)return '';

function currentDigupBankRows(){
 const d=d4Store();
 if(!d||!Array.isArray(d.banks))return state.banks.slice();
 const active=d.banks.filter(db=>db&&typeof db.name==='string'
  &&!/pluxee/i.test(db.name)&&Number.isFinite(Number(db.balance)));
 const linked=active.map(db=>state.banks.find(b=>b.digupBankId!=null&&String(b.digupBankId)===String(db.id))).filter(Boolean);
 return linked.length?linked:state.banks.slice()
}

let linkedLoanEdit=null;
let savingLinkedLoan=false;

const linkedLoanFieldLabels={
 name:'Loan name',lender:'Lender',kind:'Category',principal:'Principal',
 credited:'Amount credited',emi:'Monthly EMI',months:'Number of EMIs',
 firstDue:'First EMI due date',bank:'Preferred bank'
};

function sameLinkedLoanField(key, a, b) {
 if(a===b)return true;
 if(key==='firstDue')return String(a??'').slice(0,10)===String(b??'').slice(0,10);
 if(['principal','credited','emi','months'].includes(key))
  return a!=null&&b!=null&&a!==''&&b!==''&&Number.isFinite(Number(a))&&Number(a)===Number(b);
 return String(a??'')===String(b??'');
}

function applyLinkedLoanPatch(ledger, edit, patch, bankId) {
 const source=ledger?.loans?.find(x=>String(x.id)===edit.loan.digupLoanId);
 if(!source)throw Error('This loan is no longer available in DIG UP.');
 if(bankId!==undefined){
  const bank=bankId===''?null:ledger.banks.find(b=>String(b.id)===bankId);
  if(bankId!==''&&!bank)throw Error('That bank is no longer available in DIG UP.');
  patch={...patch,bank:bank?.name||''};
 }
 const conflicts=Object.entries(patch).filter(([key,value])=>
  !sameLinkedLoanField(key,source[key],edit.source[key])&&!sameLinkedLoanField(key,source[key],value));
 if(conflicts.length){
  const error=Error('This loan changed in DIG UP. Review the latest values before saving.');
  error.loanConflicts=conflicts.map(([key,value])=>({key,current:source[key],proposed:value}));
  throw error;
 }
 const changed=Object.entries(patch).some(([key,value])=>!sameLinkedLoanField(key,source[key],value));
 if(changed)Object.assign(source,patch);
 return changed;
}

async function saveLinkedLoanEdit(form, values, id) {
 if(savingLinkedLoan)return;
 const edit=linkedLoanEdit;
 if(edit?.loan.id!==id)return notify('Reopen the loan and try again.');
 const {bankId,...fields}=values;
 const patch={};
 for(const [key,value] of Object.entries(fields))
  if(value!==(edit.loan[key]??(key==='credited'||key==='principal'?null:'')))
   patch[key==='tenure'?'months':key]=value;
 if((patch.principal!==undefined&&(!Number.isFinite(patch.principal)||patch.principal<=0))||
    (patch.credited!=null&&(!Number.isFinite(patch.credited)||patch.credited<0))||
    !Number.isFinite(values.emi))return notify('Check the loan amounts.');
 const bank=bankId===edit.loan.bankId||!bankId?null:state.banks.find(b=>b.id===bankId);
 if(bankId!==edit.loan.bankId&&bankId&&(bank?.digupBankId==null||bank.digupInactive))
  return notify('Choose a linked DIG UP bank.');
 const preferredBank=bankId===edit.loan.bankId?undefined:String(bank?.digupBankId??'');
 const button=form.querySelector('button[type="submit"]');
 savingLinkedLoan=true;
 if(button)button.disabled=true;
 try{
  let updatePairedDigupLedger;
  if(edit.pairLink){
   ({updatePairedDigupLedger}=await import('../finance-sync/pair-sync.mjs?v=lona-loan-edit-1'));
  }
  async function saveAgainst(source){
   const currentLink=digUpHost?null:localStorage.getItem('d4-pair-link-v1');
   if(currentLink!==edit.pairLink)throw Error('Pairing changed. Reopen the loan and try again.');
   const apply=ledger=>applyLinkedLoanPatch(ledger,{...edit,source},patch,preferredBank);
   if(updatePairedDigupLedger){
    await updatePairedDigupLedger(apply);
   }else{
    const ledger=JSON.parse(digUpStorage.getItem(D4_LOCAL_KEY)||'null');
    if(apply(ledger))digUpStorage.setItem(D4_LOCAL_KEY,JSON.stringify(ledger));
    syncLocalBalances();
   }
  }
  try{
   await saveAgainst(edit.source);
  }catch(error){
   if(!error.loanConflicts||linkedLoanEdit!==edit||!form.isConnected)throw error;
   const changes=error.loanConflicts.map(({key,current,proposed})=>
    linkedLoanFieldLabels[key]+': DIG UP '+(current??'—')+' → your edit '+(proposed??'—'));
   if(!confirm('DIG UP has different values for these fields. Save your edits?\n\n'+changes.join('\n')))return;
   const reviewed={...edit.source};
   for(const {key,current} of error.loanConflicts)reviewed[key]=current;
   await saveAgainst(reviewed);
  }
  if(linkedLoanEdit===edit&&selectedLoan()?.id===id){
   linkedLoanEdit=null;
   modal=null;
   render();
  }
  notify('Loan changes saved to DIG UP');
 }catch(error){
  const message=String(error?.message||'');
  notify(/^(This loan|That bank|Pairing changed|Waiting for DIG UP|DIG UP sync data)/.test(message)
   ?message:'Could not save to DIG UP. Check sync and try again.');
 }finally{
  savingLinkedLoan=false;
  if(button)button.disabled=false;
 }
}

 case 'calendar-export':{
  const escapeIcs=s=>String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');

  const dayMinus=(ds,n)=>{const dt=new Date(ds+'T12:00:00Z');dt.setUTCDate(dt.getUTCDate()-n);return dt.toISOString().slice(0,10)};

    rows.push('END:VEVENT');count++;
  }
  rows.push('END:VCALENDAR');
  if(!count){notify('Set a first EMI date for undated loans or no upcoming payments found.');break}
  exportJson(`D47Lona-EMI-Calendar-${today()}.ics`,rows.join('\r\n')+'\r\n','text/calendar;charset=utf-8');
  notify(`${count} upcoming EMI reminders exported`);break;

function handleSubmit(e){let form=e.target.closest('form[data-form]');if(!form)return;e.preventDefault();let fd=new FormData(form);const obj=Object.fromEntries(fd);
 if(form.dataset.form==='salary'){

 if(!state.salaries||typeof state.salaries!=='object'||Array.isArray(state.salaries))state.salaries={};
 state.salaries[ym]={amount:Math.round(salary*100)/100,note:String(obj.note||'').trim().slice(0,100),updatedAt:new Date().toISOString()};
 salarySelectedMonth=ym;save();render();notify('Salary for '+monthName(ym)+' saved');return
}
 if(form.dataset.form==='loan'){
 let principal=obj.principal!==''?Number(obj.principal):null,credited=obj.credited!==''?Number(obj.credited):null,emi=Number(obj.emi),tenure=Number(obj.tenure);if(!obj.name.trim()||!(emi>0)||!Number.isInteger(tenure)||tenure<1||tenure>480)return notify('Please check name, EMI and duration');
 const old=state.loans.find(x=>x.id===obj.id);if(obj.id&&!old)return notify('This loan is no longer available.');if(old&&old.paid.length&&((old.firstDue||'')!==(obj.firstDue||'')||old.tenure!==tenure||old.emi!==emi)){if(!confirm('Changing schedule details can make past payment dates or amounts inconsistent. Continue?'))return}
 if(old?.digupLinked){
  void saveLinkedLoanEdit(form,{name:obj.name.trim(),lender:obj.lender.trim(),kind:obj.kind,bankId:obj.bankId,principal,credited,emi,tenure,firstDue:obj.firstDue||''},old.id);
  return;
 }
 const newLoan={id:old?.id||`loan-${Date.now()}`,name:obj.name.trim().slice(0,60),kind:obj.kind,bankId:obj.bankId,lender:obj.lender.trim(),principal,credited,emi,tenure,firstDue:obj.firstDue||'',source:old?.source||'Manually entered',schedule:old?.schedule||undefined,paid:old?.paid||[]};
 if(old){state.loans=state.loans.map(x=>x.id===old.id?newLoan:x)}else state.loans.push(newLoan);save();modal=null;openLoan(newLoan.id);notify(old?'Loan details updated':'Loan added');return}
 if(form.dataset.form==='payment'){

 const l=state.loans.find(x=>x.id===obj.loanId),n=Number(obj.cycle),c=l&&cycles(l).find(x=>x.num===n);

 const b=state.banks.find(x=>x.id===obj.bankId);

  state.ledger.push({id:'emi:'+l.id+':'+n,type:'emi',loanId:l.id,bankId:b.id,amount:c.amount,date:obj.paidDate,label:l.name+' EMI '+n+'/'+l.tenure,linkedD4:!!linked.linked});
 }
 l.paid.push({cycle:n,date:obj.paidDate,bankId:b.id,amount:c.amount,deducted:deduct,d4Id:linked?.linked?linked.id:null,origin:'app'});
 save();modal=null;render();
 notify(linked?.linked?'Paid · D4 DIG UP same-browser balance updated':'Paid · local balance updated');return
}
}
