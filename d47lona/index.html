html[data-theme="midnight"]{

  --theme-border:#365F80;--theme-hero:#0D3F63;--theme-primary:#2468C2;

 const seen=new Set();
 for(const bank of d.banks){
   if(!bank||typeof bank.name!=='string'||/pluxee/i.test(bank.name)||!Number.isFinite(Number(bank.balance)))continue;
   const norm=normalize(bank.name);
   if(!norm||seen.has(norm))continue;seen.add(norm);
   let existing=state.banks.find(x=>normalize(x.name)===norm);
   if(!existing){
     const base='digup-'+String(bank.id||norm).replace(/[^a-z0-9_-]/gi,'').slice(0,65);
     let id=base,n=1;while(state.banks.some(x=>x.id===id))id=base+'-'+n++;
     existing={id,name:bank.name,balance:Number(bank.balance),reserved:false,note:'Same-browser DIG UP balance'};
     state.banks.push(existing);changed=true
   }else if(Number(existing.balance)!==Number(bank.balance)){
     existing.balance=Number(bank.balance);changed=true
   }
 }
 if(changed)save();return true
}
function d4SyncStats(){
 const d=d4Store();if(!d)return {connected:false,banks:0,linked:0};
 return {connected:true,banks:d.banks.filter(x=>!/pluxee/i.test(x.name||'')).length,
 linked:state.banks.filter(b=>!!d4Match(d,b)).length};
}

/* D47Lona restore v2: accepts exported app backups, earlier direct state snapshots,
   and routes a DIG UP backup to its own safe import path. Never commits data on parse failure. */
function restoreFromJson(parsed){
 if(!parsed||typeof parsed!=='object'||Array.isArray(parsed))throw Error('JSON file must contain a backup object');
 // Distinguish DIG UP from D47Lona before validating the loan schema.
 if(parsed.format==='d4webv15'){
   if(!Array.isArray(parsed.banks)||!Array.isArray(parsed.entries))throw Error('DIG UP backup needs banks and entries arrays');
   if(parsed.banks.length>200||parsed.entries.length>150000)throw Error('DIG UP backup is too large');
   if(!parsed.banks.length&&!parsed.entries.length)throw Error('DIG UP backup is empty');
   if(parsed.banks.some(x=>!x||typeof x.name!=='string'||!Number.isFinite(Number(x.balance))))throw Error('DIG UP backup contains invalid bank values');
   const linked=d4Store();
   if(linked&&(linked.banks.length||linked.entries.length)){
     syncLocalBalances();render();
     return 'DIG UP records already exist in this browser. Nothing overwritten. Open Settings → Sync Now.';
   }
   if(!confirm('This is a DIG UP backup, not a D47Lona loan backup. Import '+parsed.banks.length+' banks and '+parsed.entries.length+' transactions for same-browser bank sync?'))return 'Import cancelled';
   localStorage.setItem(D4_LOCAL_KEY,JSON.stringify(parsed));
   syncLocalBalances();render();
   return 'DIG UP backup imported. Check bank details.';
 }
 // Some previous D47Lona exports wrap state in data; some snapshots are direct.
 const inner=parsed.app==='D47Lona'&&parsed.data?parsed.data:
   parsed.data&&Array.isArray(parsed.data.loans)?parsed.data:parsed;
 if(!inner||!Array.isArray(inner.loans)||!Array.isArray(inner.banks))
   throw Error('This is not a D47Lona loan backup. Choose D47Lona-PRIVATE-Loan-Data.json or an exported D47Lona backup.');
 if(inner.loans.length>500||inner.banks.length>200)throw Error('Backup contains too many loans or banks');
 const seenBank=new Set();
 const banks=inner.banks.map((b,i)=>{
   if(!b||typeof b!=='object'||typeof b.id!=='string'||!String(b.id).trim()||typeof b.name!=='string'||!b.name.trim())throw Error('Bank '+(i+1)+' has missing ID or name');
   if(seenBank.has(b.id))throw Error('Duplicate bank ID in backup');seenBank.add(b.id);
   if(!Number.isFinite(Number(b.balance)))throw Error('Bank '+(i+1)+' has invalid balance');
   return {...b,balance:Number(b.balance),reserved:!!b.reserved}
 });
 const seenLoan=new Set();
 const loans=inner.loans.map((loan,i)=>{
   if(!loan||typeof loan!=='object'||!String(loan.id||'').trim()||typeof loan.name!=='string')throw Error('Loan '+(i+1)+' has missing ID or name');
   if(seenLoan.has(loan.id))throw Error('Duplicate loan ID in backup');seenLoan.add(loan.id);
   const tenure=Number(loan.tenure),emi=Number(loan.emi);
   if(!Number.isInteger(tenure)||tenure<1||tenure>480||!Number.isFinite(emi)||emi<0)throw Error('Loan '+(i+1)+' has invalid EMI or tenure');
   const paid=Array.isArray(loan.paid)?loan.paid:[];
   if(paid.length>tenure||paid.some(p=>!p||!Number.isInteger(Number(p.cycle))||Number(p.cycle)<1||Number(p.cycle)>tenure))throw Error('Loan '+(i+1)+' has an invalid paid-EMI history');
   if(loan.schedule!==undefined&&(!Array.isArray(loan.schedule)||loan.schedule.length>tenure))throw Error('Loan '+(i+1)+' has an invalid EMI schedule');
   return {...loan,tenure,emi,paid};
 });
 if(inner.ledger!==undefined&&!Array.isArray(inner.ledger))throw Error('Payment ledger must be a list');
 const ledger=inner.ledger||[];
 if(ledger.length>100000)throw Error('Payment history is too large');
 const candidate={
   ...fresh(),
   ...inner,
   version:1,
   theme:['crystal','midnight','emerald','royal','gold'].includes(inner.theme)?inner.theme:'crystal',
   introStyle:['crystal','emi','vault'].includes(inner.introStyle)?inner.introStyle:'crystal',
   banks,loans,ledger
 };
 if(!confirm('Valid D47Lona backup found: '+loans.length+' loan(s), '+banks.length+' bank(s), '+ledger.length+' ledger entries. Restore it? A local recovery copy of your current data will be kept first.'))return 'Restore cancelled';
 const old=localStorage.getItem(STORE);
 // Atomic checks: verify and save before changing the in-memory application.
 if(old!==null)localStorage.setItem(STORE+'-before-restore',old);
 localStorage.setItem(STORE,JSON.stringify(candidate));
 state=candidate;
 syncLocalBalances();
 modal=null;goto('home');
 return 'D47Lona backup restored: '+loans.length+' loan(s), '+banks.length+' bank(s).';
}
function chooseRestoreJson(){
 const input=document.createElement('input');input.type='file';input.accept='.json,application/json';
 input.onchange=async()=>{
   const file=input.files?.[0];if(!file)return;
   try{
     if(file.size>8*1024*1024)throw Error('File exceeds 8 MB. Choose the original JSON backup');
     const raw=(await file.text()).replace(/^\uFEFF/,'').trim();
     if(!raw)throw Error('Selected file is empty');
     let parsed;
     try{parsed=JSON.parse(raw)}
     catch(e){throw Error('File is not valid JSON. Download a complete .json backup (not a screenshot or PDF).')}
     notify(restoreFromJson(parsed))
   }catch(e){notify('Restore failed: '+String(e.message||e));console.warn('D47Lona backup validation:',String(e.message||e))}
 };
 input.click();
}

function d4ImportBackup(){
 const input=document.createElement('input');input.type='file';input.accept='.json,application/json';
 input.onchange=async()=>{
  const f=input.files?.[0];if(!f)return;
  try{
   if(f.size>5*1024*1024)throw Error('File exceeds 5 MB');
   const data=JSON.parse(await f.text());
   if(data.format!=='d4webv15'||!Array.isArray(data.banks)||!Array.isArray(data.entries))throw Error('Choose a valid D4 DIG UP backup JSON');
   if(data.banks.length>200||data.entries.length>150000)throw Error('Unexpectedly large DIG UP backup');
   if(data.banks.some(x=>!x||typeof x.name!=='string'||!Number.isFinite(Number(x.balance))))throw Error('Invalid bank details');
   const current=d4Store();if(current&&(current.banks.length||current.entries.length)){syncLocalBalances();render();notify('This browser already has DIG UP data. Export a backup before replacing it.');return}
   if(!data.banks.length&&!data.entries.length)throw Error('This backup has no banks or transactions');
   if(!confirm('Import this DIG UP backup to this Safari browser? It will not update a different browser or device.'))return;
   localStorage.setItem(D4_LOCAL_KEY,JSON.stringify(data));
   syncLocalBalances();render();notify('DIG UP backup imported. Auto-sync ready on this browser.');
  }catch(e){notify('Import failed: '+String(e.message||e))}
 };
 input.click()
}
function recordD4Emi(loan,cycle,bank,amount,paidDate){
 const d=d4Store();if(!d)return {linked:false};
 const db=d4Match(d,bank);if(!db)return {linked:false};
 const id='d47lona:emi:'+loan.id+':'+cycle;
 const found=d.entries.find(e=>String(e.id)===id);
 if(found)return {linked:true,id,balance:Number(db.balance)};
 const before=Number(db.balance)||0,after=Math.round((before-amount)*100)/100;
 if(after<0&&!confirm('D4 DIG UP bank balance will become negative. Record this EMI anyway?'))return {cancelled:true};
 db.balance=after;
 d.entries.push({id,bankId:db.id,bank:db.name,type:'Expense',category:'Bills',amount,note:loan.name+' EMI · '+cycle+'/'+loan.tenure,created:paidDate+'T12:00:00+05:30',balanceBefore:before,balanceAfter:after,loanId:loan.id,emiCycle:cycle,source:'D47Lona'});
 try{localStorage.setItem(D4_LOCAL_KEY,JSON.stringify(d))}catch(_){return {cancelled:true}}
 return {linked:true,id,balance:after}
}
function undoD4Emi(payment,bank){
 const d=d4Store();if(!d||!payment.d4Id)return false;
 const index=d.entries.findIndex(e=>String(e.id)===payment.d4Id);
 if(index<0)return false;
 const entry=d.entries[index],db=d.banks.find(b=>String(b.id)===String(entry.bankId));
 if(!db)return false;
 db.balance=Math.round((Number(db.balance)+Number(payment.amount))*100)/100;
 d.entries.splice(index,1);
 localStorage.setItem(D4_LOCAL_KEY,JSON.stringify(d));
 if(bank)bank.balance=db.balance;
 return true
}

function notify(msg){const el=$('#toast');el.textContent=msg;el.classList.add('on');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>el.classList.remove('on'),3300)}
function balance(bankId){return state.banks.find(x=>x.id===bankId)?.balance||0}
function initialPaid(loan){return loan.paid.filter(p=>p.origin==='historical-estimate').length}
function isPaid(loan,num){return loan.paid.some(p=>p.cycle===num)}
function paidCount(loan){return loan.paid.length}
function amountFor(loan,n){return Number(loan.schedule?.[n-1]?.emi ?? loan.emi)}
function cycles(loan){if(!loan.firstDue)return [];return Array.from({length:loan.tenure},(_,i)=>({num:i+1,date:datePlusMonths(loan.firstDue,i),amount:amountFor(loan,i+1),paid:loan.paid.find(x=>x.cycle===i+1),principalLeft:loan.schedule?.[i]?.principalLeft??null,interest:loan.schedule?.[i]?.interest??null}))}
function closing(loan){return loan.firstDue?fmtDate(datePlusMonths(loan.firstDue,loan.tenure-1)):'Add first EMI date'}
function activeLoans(){return state.loans.filter(x=>paidCount(x)<x.tenure)}
function monthly(){return activeLoans().reduce((a,l)=>a+Number(l.emi),0)}

/* Month-specific salary journal. An unentered month is unknown, not a zero salary. */
function validSalaryMonth(month){return typeof month==='string'&&/^(19|20|21)\d{2}-(0[1-9]|1[0-2])$/.test(month)}
function salaryMap(){return state.salaries&&typeof state.salaries==='object'&&!Array.isArray(state.salaries)?state.salaries:{}}
function salaryRecord(month){return Object.prototype.hasOwnProperty.call(salaryMap(),month)?salaryMap()[month]:null}
function salaryAmount(month){
 const row=salaryRecord(month);if(row===null)return null;
 const raw=typeof row==='number'?row:row?.amount;
 const n=Number(raw);return Number.isFinite(n)&&n>=0?n:null;
}
function monthName(ym){
 if(!validSalaryMonth(ym))return 'Unknown month';
 const [y,m]=ym.split('-').map(Number);return MONTHS[m-1]+' '+y
}
function scheduledEmiForMonth(ym){
 if(!validSalaryMonth(ym))return 0;
 return state.loans.reduce((total,loan)=>total+cycles(loan).filter(c=>c.date.slice(0,7)===ym).reduce((sum,c)=>sum+Number(c.amount||0),0),0)
}
function salaryMonthlyStats(ym){
 const salary=salaryAmount(ym),emi=scheduledEmiForMonth(ym),after=salary===null?null:salary-emi;
 const percent=salary!==null&&salary>0?emi/salary*100:null;
 return {month:ym,salary,emi,after,percent,missingDue:state.loans.some(l=>!l.firstDue)}
}

   .sort((a,b)=>b[0].localeCompare(a[0])).slice(0,8);

  +'<div class="salary-journal-actions"><button class="button" type="submit">'+ico('check')+' '+(selected!==null?'Update':'Add')+' Salary</button>'
  +(selected!==null?'<button type="button" class="button secondary" data-salary-delete="'+safe(ym)+'">Delete this month</button>':'')+'</div></form>'
  +'<div class="salary-month-results"><div><span>EMIs scheduled · '+monthName(ym)+'</span><strong>'+money(stats.emi)+'</strong></div>'
  +'<div><span>Balance after EMI</span><strong>'+ (stats.after===null?'Add salary':money(stats.after))+'</strong></div>'

  +'<p class="footnote">Salary is entered manually and is not deducted from any bank. EMI totals use each loan’s due-date schedule.</p>'
  +(rows.length?'<div class="salary-journal-history"><h3>Saved months</h3>'
   +rows.map(([key])=>{const info=salaryMonthlyStats(key);return '<div class="salary-history-row"><div><strong>'+monthName(key)+'</strong><span>Salary '+money(info.salary)+' · EMI '+money(info.emi)+'</span></div><div><strong>'+ (info.after===null?'—':money(info.after))+'</strong><button type="button" data-salary-edit="'+safe(key)+'" aria-label="Edit salary for '+monthName(key)+'">'+ico('edit')+' Edit</button></div></div>'}).join('')
   +'</div>':'')+'</section>'
}

function loanCard(l,compact=false){

 const finished=p>=total;
 return `<article class="glass loan-compact loan-tone-${tone}">

 </article>`
}

function d47BankLogo(b){
 const name=String(b.name||'Bank'),key=name.trim().toLowerCase();
 const src=D47_BANK_LOGOS[key]||D47_BANK_LOGOS[key.replace(/ +(?:ltd|limited)\.?$/,'')]||'';
 const initials=name.split(/\s+/).filter(w=>!['bank','of','india','the'].includes(w.toLowerCase())).map(w=>w[0]).join('').slice(0,3).toUpperCase()||'B';
 return '<span class="bank-brand bank-icon" aria-hidden="true">'+(src?'<img src="'+safe(src)+'" alt="" loading="lazy"><span class="bank-logo-fallback" hidden>'+safe(initials)+'</span>':'<span class="bank-logo-fallback">'+safe(initials)+'</span>')+'</span>';
}
function bankDetailModal(id){
 const b=state.banks.find(x=>String(x.id)===String(id));if(!b)return '';
 const d=d4Store(),db=d?d4Match(d,b):null;
 const entries=db?d.entries.filter(e=>e&&(String(e.bankId)===String(db.id)||String(e.toBankId)===String(db.id))):[];
 const recent=entries.slice().sort((a,c)=>String(c.created||c.date||'').localeCompare(String(a.created||a.date||''))).slice(0,6);
 const details=recent.map(e=>{
   const incoming=e.type==='Income'||(e.type==='Transfer'&&String(e.toBankId)===String(db.id));
   return '<div class="bank-statement-line"><div><strong>'+safe(e.category||e.type||'Transaction')+'</strong><small>'+safe(String(e.created||e.date||'').slice(0,10))+' · '+safe(e.note||e.type||'')+'</small></div><b class="'+(incoming?'incoming':'outgoing')+'">'+(incoming?'+':'−')+money(e.amount)+'</b></div>';
 }).join('');
 const nick=db&&db.nick?String(db.nick):b.nick?String(b.nick):'';
 return '<div class="modal-shade" role="presentation"><div class="modal" role="dialog" aria-modal="true" aria-label="'+safe(b.name)+' bank details">'
 +'<div class="modal-title"><h2>Bank details</h2><button class="icon-btn" data-action="close-modal" aria-label="Close">'+ico('close')+'</button></div>'
 +'<div class="bank-details-head">'+d47BankLogo(b)+'<div><strong>'+safe(b.name)+'</strong><p class="small">'+safe(nick||((db?'DIG UP linked on this browser':'Manual / imported balance')))+'</p></div></div>'
 +'<div class="bank-detail-balance"><small>Recorded balance · Not a live bank account</small><strong>'+remainText(b.balance)+'</strong></div>'
 +(b.reserved?'<div class="notice warn">This bank balance is reserved.</div>':'')
 +(db?'<p class="small" style="margin-top:12px">'+entries.length+' DIG UP entries in this browser</p>':'<div class="notice">No linked DIG UP data in this browser. Import DIG UP backup or open DIG UP in the same Safari browser.</div>')
 +(details?'<h3 class="bank-detail-heading">Recent activity</h3><div class="bank-statement">'+details+'</div>':'')
 +'<p class="footnote" style="margin:16px 0">This app does not connect to your bank directly. Verify your recorded balance against your statement.</p>'
 +'<div class="button-group"><button class="button secondary" data-action="sync-now">Sync Now</button><button class="button secondary" data-action="import-digup">Import DIG UP Backup</button></div></div></div>'
}

function loanDetail(l){const cs=cycles(l),count=paidCount(l),pct=Math.round(count/l.tenure*1000)/10, end=closing(l), cur=cs.slice(cyclePage*6,cyclePage*6+6);let upcoming=cs.find(c=>!c.paid&&c.date>=today())||cs.find(c=>!c.paid);let consecutive=0;while(consecutive<l.tenure&&isPaid(l,consecutive+1))consecutive++;let outstanding=l.schedule?(consecutive?l.schedule[consecutive-1]?.principalLeft:l.principal):l.principal;return `${header('LOANS','Loan Details')}<div class="stack d47-neon-detail"><button class="text-btn" data-action="back-loans">${ico('back')} All loans</button>
 <section class="glass detail-top loan-detail-kind-${safe(l.kind||'other')}"><div class="loan-top">${loanIcon(l)}<div class="loan-top-copy"><div class="loan-title">${safe(l.name)}</div><div class="small">${safe(l.lender||'Loan')}</div></div><span class="badge">${count>=l.tenure?'Closed':'Active'}</span></div><div class="detail-progress"><div class="progress-ring" style="--pct:${pct}%"><span>${pct}%<small>Paid cycles</small></span></div><div style="flex:1"><h2>${count} of ${l.tenure} cycles</h2><p class="sub">${l.tenure-count} remaining · ${end}</p><div class="button-group" style="margin-top:12px"><button class="button secondary mini" data-action="edit-loan">${ico('edit')} Edit</button>${upcoming?`<button class="button mini" data-pay="${l.id}:${upcoming.num}">${ico('check')} Mark paid</button>`:''}</div></div></div></section>
 <div class="detail-grid"><div class="mini-panel"><span class="small">Monthly EMI</span><div class="val">${money(l.emi)}</div></div><div class="mini-panel"><span class="small">Closing date</span><div class="val" style="font-size:15px">${end}</div></div><div class="mini-panel"><span class="small">${l.id==='iphone'?'Outstanding principal*':l.principal!=null?'Original principal':'Credited amount'}</span><div class="val">${l.id==='iphone'?money(outstanding):l.principal!=null?money(l.principal):l.credited!=null?money(l.credited):'Not set'}</div></div><div class="mini-panel"><span class="small">Next EMI due</span><div class="val" style="font-size:15px">${upcoming?fmtDate(upcoming.date):l.firstDue?'All cycles paid':'Date not set'}</div></div></div>
 ${l.productType&&l.productType.toLowerCase()!==l.name.toLowerCase()?`<p class="footnote">Bank's official loan product: <strong>${safe(l.productType)}</strong>. “${safe(l.name)}” is your display name only.</p>`:''}
 ${!l.firstDue?`<div class="notice warn">${ico('info')}First EMI date not supplied. Edit this loan to enable the full 60-month calendar and due date reminders.</div>`:''}
 ${l.id==='iphone'?`<p class="footnote">*iPhone principal by the original HDFC schedule (not a live bank statement). The final scheduled EMI is ₹2,877. Actual overdue charges or prepayments are not included.</p>`:''}
 <div class="section-title"><h2>EMI cycle schedule</h2>${cs.length?`<span class="small">${cs.length} cycles</span>`:''}</div>
 ${cs.length?`<div class="tabbar">${[['all','All'],['paid','Paid'],['upcoming','Not paid']].map(([id,label])=>`<button data-cycle-filter="${id}" class="${cycleFilter===id?'selected':''}">${label}</button>`).join('')}</div>${cycleList(l,cs)}`:`<div class="date-note">Add the first due date to generate the full payment-cycle schedule.</div>`}
 <div class="section-title"><h2>Payment history</h2></div><div class="glass">${l.paid.length?l.paid.slice().sort((a,b)=>b.cycle-a.cycle).slice(0,8).map(p=>`<div class="list-tile" style="border-bottom:1px solid #e3edf0"><div class="loan-icon" style="height:35px;width:35px">${ico('check')}</div><div class="body"><strong>Cycle ${p.cycle} · ${fmtDate(p.date)}</strong><div class="small">${p.origin==='historical-estimate'?'Imported as paid — verify':'Recorded in this app'}</div></div><div class="money">${money(p.amount)}</div></div>`).join(''):`<div class="empty"><p class="sub">No payments recorded yet.</p></div>`}</div>
 <div class="button-group"><button class="button secondary" data-action="edit-loan">${ico('edit')} Edit loan</button><button class="button secondary" data-action="delete-loan">${ico('trash')} Delete loan</button></div></div>`}
function cycleList(l,cs){let filtered=cs.filter(c=>cycleFilter==='all'||(cycleFilter==='paid'?!!c.paid:!c.paid)),max=Math.max(0,Math.ceil(filtered.length/6)-1),p=Math.min(cyclePage,max),pageItems=filtered.slice(p*6,p*6+6);return `<div class="stack" style="gap:8px">${pageItems.length?pageItems.map(c=>`<div class="glass cycle-row"><div class="cycle-num ${c.paid?'is-paid':''}">${c.paid?ico('check'):c.num}</div><div class="cycle-main"><strong>Cycle ${c.num} · ${fmtDate(c.date)}</strong><span class="small">${c.paid?'Paid'+(c.paid.origin==='historical-estimate'?' (imported)':''):c.date<today()?'Past due — check status':'Upcoming'}${c.interest!=null?` · Interest ${money(c.interest)}`:''}</span></div><div class="cycle-right"><strong>${money(c.amount)}</strong><button class="text-btn" data-pay="${l.id}:${c.num}">${c.paid&&c.paid.origin!=='historical-estimate'?'Undo':c.paid?'View':'Mark paid'}</button></div></div>`).join(''):`<div class="date-note">No cycles match this filter.</div>`}<div class="pagination"><button class="button secondary mini" data-cycle-page="${p-1}" ${p===0?'disabled':''}>${ico('back')} Previous</button><span>${filtered.length?`${p*6+1}–${Math.min(filtered.length,p*6+6)} / ${filtered.length}`:'0 cycles'}</span><button class="button secondary mini" data-cycle-page="${p+1}" ${p>=max?'disabled':''}>Next ${ico('right')}</button></div></div>`}
function scheduleView(){let ym=iso(calYear,calMonth+1,1);let inMonth=[];for(const l of state.loans){inMonth.push(...cycles(l).filter(c=>c.date.startsWith(ym.slice(0,7))).map(c=>({loan:l,cycle:c})))}inMonth.sort((a,b)=>a.cycle.date.localeCompare(b.cycle.date));let cells='',start=new Date(Date.UTC(calYear,calMonth,1)).getUTCDay(),count=new Date(Date.UTC(calYear,calMonth+1,0)).getUTCDate();for(let i=0;i<start;i++)cells+='<div class="day empty">.</div>';for(let d=1;d<=count;d++){let id=iso(calYear,calMonth+1,d),has=inMonth.some(x=>x.cycle.date===id);cells+=`<div class="day ${has?'due':''} ${id===today()?'today':''}" title="${has?'EMI due':''}">${d}</div>`}return `${header('YOUR PAYMENT CALENDAR','EMI Schedule')}<div class="stack"><div class="glass" style="padding:15px"><div class="schedule-head"><button class="icon-btn" data-action="cal-prev" aria-label="Previous month">${ico('back')}</button><h2>${MONTHS[calMonth]} ${calYear}</h2><button class="icon-btn" data-action="cal-next" aria-label="Next month">${ico('right')}</button></div><div class="calendar"><div class="calendar-header">${week.map(d=>`<span>${d}</span>`).join('')}</div><div class="calendar-grid">${cells}</div></div><div class="strip">${ico('calendar')} Green date = EMI scheduled in this month</div></div>

 <div class="section-title"><h2>Payments this month</h2></div>${inMonth.length?inMonth.map(({loan,cycle})=>`<div class="glass list-tile">${loanIcon(loan)}<div class="body"><strong>${safe(loan.name)}</strong><div class="small">${fmtDate(cycle.date)} · Cycle ${cycle.num} · ${cycle.paid?'Paid':'Pending'}</div></div><div style="text-align:right"><div class="money">${money(cycle.amount)}</div><button class="text-btn" data-pay="${loan.id}:${cycle.num}">${cycle.paid?'Details':'Mark paid'}</button></div></div>`).join(''):`<div class="glass empty"><p class="sub">No scheduled EMI dates in this month.</p></div>`}<div class="notice">${ico('info')}${state.loans.some(l=>!l.firstDue)?"Some loans need their first EMI date to appear in the calendar.":"All scheduled EMI dates are shown for this month."}</div></div>`}

 `<form data-form="payment"><input type="hidden" name="loanId" value="${l.id}"/><input type="hidden" name="cycle" value="${c.num}"/><div class="field"><label for="paid-date">Date paid *</label><input id="paid-date" name="paidDate" type="date" required value="${today()}" /></div><div class="field"><label for="pay-bank">Paid from bank *</label><select id="pay-bank" name="bankId">${state.banks.map(b=>`<option value="${b.id}" ${b.id===l.bankId?'selected':''}>${safe(b.name)}${b.reserved?' · reserved for trip':''}</option>`).join('')}</select></div><label class="toggle-row" style="border:1px solid #d5e8e7;border-radius:13px;margin-bottom:15px;cursor:pointer"><div class="body"><strong>Record local bank deduction</strong><div class="small">Subtract this EMI once from the selected local balance and add a ledger entry.</div></div><input style="width:20px;height:20px;accent-color:#0baf8c" type="checkbox" name="deduct" checked /></label><div class="notice warn" style="margin-bottom:15px">${ico('info')} This never sends real money. On the same GitHub Pages domain, a linked DIG UP record is updated once. Otherwise, local balance only. Turn off deduction if already recorded elsewhere.</div><button class="button full" type="submit">${ico('check')} Confirm paid</button></form>`}</div></div>`}

function render(){document.body.classList.toggle('d47-neon-mode',view==='loans'||view==='detail');document.documentElement.dataset.theme=state.theme;const browserThemeColors={crystal:'#edf9f8',midnight:'#07172D',emerald:'#051F1B',royal:'#1A0B2E',gold:'#201809'};document.querySelector('meta[name="theme-color"]')?.setAttribute('content',(view==='loans'||view==='detail')?'#091325':browserThemeColors[state.theme]||browserThemeColors.crystal);let body=view==='home'?home():view==='loans'?loansView():view==='schedule'?scheduleView():view==='reminders'?remindersView():view==='settings'?settingsView():view==='detail'&&selectedLoan()?loanDetail(selectedLoan()):home();$('#app').innerHTML=`<div class="shell"><aside class="rail"><div class="brand"><div class="logo"><b>D47</b><small>LONA</small></div><div class="brand-text"><b>D47<em>Lona</em></b><small>Smart Loan Manager</small></div></div><div class="rail-label">YOUR FINANCES</div>${navItems()}<div class="rail-footer">${ico('shield')} Offline-first app<br/>App data stays on this device.<br/>${d4BrowserLinked()?'DIG UP same-browser link active.':'DIG UP cloud sync not connected.'}</div></aside><main class="main"><div class="mobile-brand"><div class="logo"><b>D47</b><small>LONA</small></div><div class="brand-text"><b>D47<em>Lona</em></b><small>Smart Loan Manager</small></div><span class="sync-indicator" title="Live connection pending">${ico('shield')} Local mode</span></div>${body}<div class="footspace"></div></main><nav class="mobile-nav" aria-label="Main navigation">${navItems(true)}</nav></div>${modal||''}`}
function goto(name){view=name;detailId=null;modal=null;render();window.scrollTo({top:0,behavior:'instant'})}
function openLoan(id){detailId=id;view='detail';cycleFilter='all';let l=selectedLoan();let next=cycles(l).findIndex(c=>!c.paid);cyclePage=next>=0?Math.floor(next/6):0;render();window.scrollTo({top:0,behavior:'instant'})}
function markPayment(lid,n){let l=state.loans.find(x=>x.id===lid);if(!l){notify('Loan not found');return}let c=cycles(l).find(x=>x.num===n);if(!c){notify('Set first EMI date to enable payments');return}modal=payForm(l,c);render()}
function closeModal(){modal=null;render()}
function exportJson(name,content,type='application/json'){const a=document.createElement('a'),blob=new Blob([content],{type}),url=URL.createObjectURL(blob);a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000)}
function handleClick(e){let el=e.target.closest('button,[data-nav],[data-pay],[data-open-loan],[data-theme-choose],[data-bank-detail]');if(!el)return;
 const navKey=el.dataset.nav;if(navKey){goto(navKey);return}
 if(el.dataset.openLoan){openLoan(el.dataset.openLoan);return}
 if(el.dataset.bankDetail){modal=bankDetailModal(el.dataset.bankDetail);render();return}
 if(el.dataset.salaryEdit){
  const ym=el.dataset.salaryEdit;if(!validSalaryMonth(ym))return;
  salarySelectedMonth=ym;render();document.getElementById('salary-journal')?.scrollIntoView({behavior:'smooth',block:'center'});return
 }
 if(el.dataset.salaryDelete){
  const ym=el.dataset.salaryDelete;if(!validSalaryMonth(ym)||!salaryRecord(ym))return;
  if(!confirm('Delete the recorded salary for '+monthName(ym)+'? This does not affect loan payments or bank balances.'))return;
  delete state.salaries[ym];save();render();notify('Salary record deleted');return
 }
 if(el.dataset.pay){let [id,n]=el.dataset.pay.split(':');markPayment(id,Number(n));return}
 if(el.dataset.undo){let[id,n]=el.dataset.undo.split(':'),l=state.loans.find(x=>x.id===id),p=l?.paid.find(x=>x.cycle===Number(n));if(!p)return;if(!confirm(p.origin==='historical-estimate'?'Remove imported paid status for cycle '+n+'?':'Undo this EMI and restore linked balances?'))return;
 let bank=state.banks.find(x=>x.id===p.bankId),restored=false;
 if(p.deducted&&p.d4Id){try{restored=undoD4Emi(p,bank)}catch(_){notify('Could not update DIG UP. Undo cancelled to avoid inconsistent balances.');return}}
 if(p.deducted&&!restored&&bank)bank.balance=Number((bank.balance+p.amount).toFixed(2));
 l.paid=l.paid.filter(x=>x!==p);state.ledger=state.ledger.filter(x=>x.id!==`emi:${id}:${n}`);
 save();modal=null;render();notify(restored?'Payment undone in both apps':'Payment undone locally');return}
 if(el.dataset.themeChoose){state.theme=el.dataset.themeChoose;save();render();notify('Theme saved');return}
 if(el.dataset.introChoose){
  const intro=el.dataset.introChoose;
  if(!['crystal','emi','vault'].includes(intro))return;
  state.introStyle=intro;save();render();
  if(window.D47Intro)window.D47Intro.play(intro);
  else notify('Opening intro saved');
  return;
 }
 if(el.dataset.filter){filter=el.dataset.filter;render();return}
 if(el.dataset.cycleFilter){cycleFilter=el.dataset.cycleFilter;cyclePage=0;render();return}
 if(el.dataset.cyclePage!==undefined){cyclePage=Math.max(0,Number(el.dataset.cyclePage));render();return}
 switch(el.dataset.action){
 case 'salary-manage':salarySelectedMonth=today().slice(0,7);goto('settings');setTimeout(()=>document.getElementById('salary-journal')?.scrollIntoView({behavior:'smooth',block:'start'}),80);break;
 case 'add-loan':modal=addForm();render();break;
 case 'edit-loan':modal=addForm(selectedLoan());render();break;
 case 'close-modal':closeModal();break;
 case 'back-loans':goto('loans');break;
 case 'privacy':state.hideMoney=!state.hideMoney;save();render();break;
 case 'cal-prev':calMonth--;if(calMonth<0){calMonth=11;calYear--}render();break;
 case 'cal-next':calMonth++;if(calMonth>11){calMonth=0;calYear++}render();break;
 case 'toggle-early':state.reminderDays=state.reminderDays?0:3;save();render();break;
 case 'toggle-due':state.reminderOnDue=!state.reminderOnDue;save();render();break;
 case 'toggle-overdue':state.reminderAfterDue=!state.reminderAfterDue;save();render();break;
 case 'pay-next':{let dues=dueSoon();if(dues.length)markPayment(dues[0].loan.id,dues[0].cycle.num);else notify('No upcoming dated EMI. Set missing first due dates.');break}
 case 'sync-info':modal=infoModal('D4 DIG UP Sync',`<div class="notice">${ico('shield')} ${d4BrowserLinked()?'Same-browser local sync is connected.':'No DIG UP data in this browser yet.'}</div><p class="sub" style="margin-top:14px">Use D4 DIG UP and D47Lona under djproductions730-rgb.github.io in the same Safari browser. Bank balances refresh whenever you open, return to or refresh D47Lona.</p><p class="sub" style="margin-top:12px">Paid EMI with deduction makes ONE linked Expense in DIG UP; Undo reverses it. Ordinary expenses change balances only, not EMI Paid status.</p><p class="sub" style="margin-top:12px">Different browsers, iPhone installed-app storage and other devices may be isolated. Import your DIG UP backup to migrate local data. Cross-device auto-sync needs a shared authenticated cloud backend.</p>`);render();break;
 case 'sync-now':{const linked=syncLocalBalances();render();notify(linked?'DIG UP balances refreshed from this browser':'No DIG UP records here. Open DIG UP in Safari or import backup.');break}
 case 'import-digup':d4ImportBackup();break;
 case 'open-digup':window.open(new URL('../',location.href).href,'_blank','noopener');break;
 case 'export':exportJson(`D47Lona-backup-${today()}.json`,JSON.stringify({app:'D47Lona',exportedAt:new Date().toISOString(),data:state},null,2));notify('Backup exported');break;
 case 'export-digup':{let data=state.ledger.filter(x=>x.type==='emi').map(x=>({externalId:x.id,source:'D47Lona',transactionType:'Expense',category:'Loan EMI',loanId:x.loanId,amount:x.amount,bankId:x.bankId,date:x.date,description:x.label}));exportJson(`D47Lona-DIGUP-entries-${today()}.json`,JSON.stringify({note:'For manual integration; not imported into DIG UP automatically',entries:data},null,2));notify('DIG UP-compatible local entries exported');break}
 case 'import':chooseRestoreJson();break;
 case 'reset':if(confirm('Reset all local loans and payments to the initial loan data? This cannot be undone without a backup.')){state=fresh();save();goto('home');notify('Initial data restored')}break;
 case 'delete-loan':{const l=selectedLoan();if(!l)return;if(l.paid.some(x=>x.deducted)){notify('Undo locally recorded payments before deleting this loan.');return}if(confirm(`Delete ${l.name}? This will remove its schedule and payment history.`)){state.loans=state.loans.filter(x=>x.id!==l.id);save();goto('loans');notify('Loan deleted')}break}
 case 'calendar-export':{
  const escapeIcs=s=>String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
  const toIcsDate=d=>d.replaceAll('-','');
  const dayMinus=(ds,n)=>{const dt=new Date(ds+'T12:00:00Z');dt.setUTCDate(dt.getUTCDate()-n);return dt.toISOString().slice(0,10)};
  const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
  const rows=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//D47Lona//EMI Reminders//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:D47Lona EMI Reminders'];
  let count=0;
  for(const loan of state.loans)for(const c of cycles(loan)){
    if(c.paid||c.date<today())continue;
    const start=toIcsDate(c.date),end=toIcsDate(datePlusDays(c.date,1));
    const summary=escapeIcs(`D47Lona: ${loan.name} EMI ${money(c.amount)}`);
    const description=escapeIcs(`Cycle ${c.num} of ${loan.tenure}. Confirm payment in your lender app, then mark as Paid in D47Lona. Calendar event only – it does not transfer money.`);
    rows.push('BEGIN:VEVENT',`UID:d47lona-${loan.id}-${c.num}@d47lona.local`,`DTSTAMP:${stamp}`,`DTSTART;VALUE=DATE:${start}`,`DTEND;VALUE=DATE:${end}`,`SUMMARY:${summary}`,`DESCRIPTION:${description}`);
    if(state.reminderDays>0)rows.push('BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${summary}`,`TRIGGER:-P${state.reminderDays}D`,'END:VALARM');
    if(state.reminderOnDue)rows.push('BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${summary}`,'TRIGGER:PT0S','END:VALARM');
    rows.push('END:VEVENT');count++;
  }
  rows.push('END:VCALENDAR');
  if(!count){notify('Set a first EMI date for undated loans or no upcoming payments found.');break}
  exportJson(`D47Lona-EMI-Calendar-${today()}.ics`,rows.join('\r\n')+'\r\n','text/calendar;charset=utf-8');
  notify(`${count} upcoming EMI reminders exported`);break;
 }
 case 'intro-replay':if(window.D47Intro)window.D47Intro.play(state.introStyle||'crystal');else notify('Opening intro not ready yet');break;
 case 'install-help':modal=infoModal('Install D47Lona',`<p class="sub">After uploading this app to an HTTPS website:</p><p style="margin-top:12px"><b>iPhone:</b> Safari → Share → Add to Home Screen.</p><p style="margin-top:12px"><b>Android:</b> Chrome → Menu → Install app or Add to Home screen.</p><p class="sub" style="margin-top:12px">Offline use works after the first visit. Back up your data before changing devices.</p>`);render();break;
 case 'notify-permission':if(!('Notification' in window)){notify('Browser notifications are not supported');break}Notification.requestPermission().then(p=>notify(p==='granted'?'Browser permission enabled. In-app reminders are active.':'Notification permission not enabled.'));break;
 }
}
function handleSubmit(e){let form=e.target.closest('form[data-form]');if(!form)return;e.preventDefault();let fd=new FormData(form);const obj=Object.fromEntries(fd);
 if(form.dataset.form==='salary'){
 const ym=String(obj.month||'');
 const salary=Number(obj.salary);
 if(!validSalaryMonth(ym)||!Number.isFinite(salary)||salary<0||salary>1000000000)return notify('Choose a valid month and salary amount');
 if(!state.salaries||typeof state.salaries!=='object'||Array.isArray(state.salaries))state.salaries={};
 state.salaries[ym]={amount:Math.round(salary*100)/100,note:String(obj.note||'').trim().slice(0,100),updatedAt:new Date().toISOString()};
 salarySelectedMonth=ym;save();render();notify('Salary for '+monthName(ym)+' saved');return
}
 if(form.dataset.form==='loan'){
 let principal=obj.principal!==''?Number(obj.principal):null,credited=obj.credited!==''?Number(obj.credited):null,emi=Number(obj.emi),tenure=Number(obj.tenure);if(!obj.name.trim()||!(emi>0)||!Number.isInteger(tenure)||tenure<1||tenure>480)return notify('Please check name, EMI and duration');
 const old=state.loans.find(x=>x.id===obj.id);if(old&&old.paid.length&&((old.firstDue||'')!==(obj.firstDue||'')||old.tenure!==tenure||old.emi!==emi)){if(!confirm('Changing schedule details can make past payment dates or amounts inconsistent. Continue?'))return}
 const newLoan={id:old?.id||`loan-${Date.now()}`,name:obj.name.trim().slice(0,60),kind:obj.kind,bankId:obj.bankId,lender:obj.lender.trim(),principal,credited,emi,tenure,firstDue:obj.firstDue||'',source:old?.source||'Manually entered',schedule:old?.schedule||undefined,paid:old?.paid||[]};
 if(old){state.loans=state.loans.map(x=>x.id===old.id?newLoan:x)}else state.loans.push(newLoan);save();modal=null;openLoan(newLoan.id);notify(old?'Loan details updated':'Loan added');return}
 if(form.dataset.form==='payment'){
 const l=state.loans.find(x=>x.id===obj.loanId),n=Number(obj.cycle),c=l&&cycles(l).find(x=>x.num===n);
 if(!l||!c)return notify('Payment could not be recorded');
 if(isPaid(l,n)){modal=null;render();return notify('This EMI is already marked paid')}
 const b=state.banks.find(x=>x.id===obj.bankId);
 if(!b)return notify('Choose a valid bank');
 const deduct=fd.has('deduct');
 if(deduct&&b.reserved&&!confirm('This bank is reserved for another purpose. Use it for the EMI?'))return;
 let linked=null;
 if(deduct){
  linked=recordD4Emi(l,n,b,c.amount,obj.paidDate);
  if(linked.cancelled)return notify('EMI not recorded: bank update cancelled');
  if(!linked.linked&&b.balance<c.amount&&!confirm('This will make the manually recorded bank balance negative. Continue?'))return;
  b.balance=linked.linked?linked.balance:Number((b.balance-c.amount).toFixed(2));
  state.ledger.push({id:'emi:'+l.id+':'+n,type:'emi',loanId:l.id,bankId:b.id,amount:c.amount,date:obj.paidDate,label:l.name+' EMI '+n+'/'+l.tenure,linkedD4:!!linked.linked});
 }
 l.paid.push({cycle:n,date:obj.paidDate,bankId:b.id,amount:c.amount,deducted:deduct,d4Id:linked?.linked?linked.id:null,origin:'app'});
 save();modal=null;render();
 notify(linked?.linked?'Paid · D4 DIG UP same-browser balance updated':'Paid · local balance updated');return
}
}
function datePlusDays(ds,n){const d=new Date(ds+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
function setupNotifications(){const early=state.reminderDays;let now=today(),due=[];for(let l of state.loans)for(let c of cycles(l)){if(c.paid)continue;let delta=diffDays(c.date,now);if((early&&delta===early)||(state.reminderOnDue&&delta===0)||(state.reminderAfterDue&&delta<0&&delta>=-1))due.push(`${l.name}: ${money(c.amount)} on ${fmtDate(c.date)}`)}if(due.length&&'Notification'in window&&Notification.permission==='granted'){const key=`notification:${now}:${due.join('|')}`;if(sessionStorage.getItem(key))return;sessionStorage.setItem(key,'1');new Notification('D47Lona · EMI reminder',{body:due.slice(0,2).join(' · '),icon:'icons/icon-192.png'})}}
document.addEventListener('error',e=>{const img=e.target;if(img&&img.matches?.('.bank-icon img')){img.hidden=true;if(img.nextElementSibling)img.nextElementSibling.hidden=false}},true);
document.addEventListener('change',e=>{if(e.target?.id==='salary-month'&&validSalaryMonth(e.target.value)){salarySelectedMonth=e.target.value;render()}});
document.addEventListener('click',handleClick);document.addEventListener('submit',handleSubmit);document.addEventListener('click',e=>{if(e.target.classList.contains('modal-shade'))closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal)closeModal()});
syncLocalBalances();render();setTimeout(setupNotifications,1300);
window.addEventListener('focus',()=>{if(syncLocalBalances())render()});
window.addEventListener('storage',e=>{if(e.key===D4_LOCAL_KEY){syncLocalBalances();render()}});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&syncLocalBalances())render()});
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script>
