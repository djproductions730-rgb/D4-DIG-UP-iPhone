/* Spotlight cards: strong contrast, clear type and large tap targets */

/* Six-tab iOS navigation and loan management */
.bottom{gap:2px;padding-left:5px;padding-right:5px}
.navbtn{font-size:9px;padding:8px 1px;min-width:0;gap:5px}

/* EMI reminder dashboard */
.loan-summary-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:13px 0}

<script>
'use strict';
// This app is intentionally local-only; no finance data is sent to the public GitHub repository.
const LOGOUT_KEY='d4-local-logged-out-v1';
let loggedOut=false;try{loggedOut=localStorage.getItem(LOGOUT_KEY)==='1'}catch(_){}
const KEY='d4webv15', fmt=n=>'₹'+Number(n).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}), tidy=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const catalog=['State Bank of India','HDFC Bank','ICICI Bank','Axis Bank','Punjab National Bank','Bank of Baroda','Canara Bank','Union Bank of India','Indian Bank','Bank of India','Indian Overseas Bank','UCO Bank','Central Bank of India','Bank of Maharashtra','Punjab & Sind Bank','Kotak Mahindra Bank','Federal Bank','IDFC FIRST Bank','IndusInd Bank','YES BANK','RBL Bank','Bandhan Bank','DCB Bank','City Union Bank','Karur Vysya Bank','Tamilnad Mercantile Bank','South Indian Bank','Karnataka Bank','CSB Bank','Jammu & Kashmir Bank','Nainital Bank','Dhanlaxmi Bank','AU Small Finance Bank','Equitas Small Finance Bank','Ujjivan Small Finance Bank','Utkarsh Small Finance Bank','Suryoday Small Finance Bank','ESAF Small Finance Bank','Jana Small Finance Bank','Shivalik Small Finance Bank','Capital Small Finance Bank','Airtel Payments Bank','India Post Payments Bank','Fino Payments Bank','Jio Payments Bank'];
const cats={Food:['🍔','#fa9e48'],Family:['👨‍👩‍👧','#6d7dff'],Petrol:['⛽','#ef5d62'],Movies:['🎬','#9059d7'],Shopping:['🛍️','#f58ab1'],Travel:['🚗','#54aaf5'],Bills:['🧾','#3dbb97'],Other:['📦','#9295ab']};
const tabs=[['home','⌂','Home'],['banks','▣','Banks'],['transactions','⇄','Spends'],['plans','◈','Plans'],['savings','🌱','Savings'],['loans','🪙','Loans'],['settings','⚙','Settings']];

// Each row is a savings threshold in rupees and a Fibonacci age.
const growthStages = [
 [0,0,'🌱','Starting out'],[10,1,'👶','Baby'],[1000,2,'🧒','Toddler'],
 [1010,3,'🧒','Little explorer'],[2010,5,'👦','School kid'],[3020,8,'👦','Growing kid'],
 [5030,13,'🧑','Teenager'],[8050,21,'👨','Young man'],[13080,34,'👨🏻‍💼','Adult'],
 [21130,55,'🧔','Older adult'],[34210,89,'👴','Grandfather']
];
function growthState(entries){
 const paise=entries.reduce((n,e)=>n+e.paise,0);
 const index=growthStages.filter(s=>paise>=s[0]*100).length-1;
 return {paise,stage:growthStages[index],next:growthStages[index+1]};
}
function validSavings(entries){
 if(!Array.isArray(entries))return false;
 let balance=0;
 return entries.every(e=>e&&Number.isSafeInteger(e.paise)&&e.paise!==0
  &&typeof e.date==='string'&&Number.isFinite(Date.parse(e.date))
  &&Number.isSafeInteger(balance+=e.paise)&&balance>=0);
}
function savingsMoney(paise){
 return '₹'+(paise/100).toLocaleString('en-IN',{maximumFractionDigits:2});
}
function savingsPortrait(stage,large=false){
 const cell=growthStages.indexOf(stage);
 return '<span class="savings-portrait'+(large?' large':'')+'" aria-hidden="true" style="--x:'+((cell%4)*100/3)+'%;--y:'+(Math.floor(cell/4)*50)+'%"></span>';
}

function savingsAccounts(){
 const accounts=new Map();
 for(const entry of data.savings||[]){
  const id=String(entry.bankId||'');
  if(!accounts.has(id))accounts.set(id,{id,label:entry.bankLabel||'Earlier savings · bank unspecified',amount:0});
  accounts.get(id).amount+=entry.paise;
 }
 return accounts;
}
function rollSavingsTotal(from,to){
 const display=document.getElementById('savingCounter');
 if(!display||window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 const final=savingsMoney(to),previous=savingsMoney(from).replace(/\D/g,'').split('').reverse();
 let offset=final.replace(/\D/g,'').length;
 display.innerHTML=Array.from(final,c=>{
  if(!/\d/.test(c))return c;
  const first=Number(previous[--offset]||0),steps=10+(Number(c)-first+10)%10;
  const strip=Array.from({length:steps+1},(_,i)=>'<i>'+((first+i)%10)+'</i>').join('');
  return '<span class="saving-wheel"><span style="--travel:-'+steps+'em;--duration:'+(650+Math.min(offset,6)*70)+'ms">'+strip+'</span></span>';
 }).join('');
 setTimeout(()=>{if(display.isConnected)display.textContent=final;},1150);
}
function savingsPage(){
 const entries=data.savings||[],{paise,stage,next}=growthState(entries);
 const history=entries.slice().reverse().map(e=>'<div class="card row"><span>'+tidy(new Date(e.date).toLocaleDateString('en-IN'))+'<br><small>'+tidy(e.bankLabel||'Earlier savings · bank unspecified')+'</small></span><strong>'+ (e.paise>0?'+':'−')+savingsMoney(Math.abs(e.paise))+'</strong></div>').join('');
 const progress=next?'<progress aria-label="Progress to next age" style="width:100%" value="'+(paise-stage[0]*100)+'" max="'+((next[0]-stage[0])*100)+'"></progress><p>'+savingsMoney(next[0]*100-paise)+' to age '+next[1]+' · '+next[3]+'</p>':'<p>Grandfather milestone reached 🎉</p>';
 return '<button class="button ghost" onclick="go(\'home\')">‹ Home</button><h2>Savings Journey</h2><div class="hero"><div class="saving-picture">'+savingsPortrait(stage,true)+'<div class="saving-dial" aria-label="Total saved '+savingsMoney(paise)+'"><small>TOTAL SAVED</small><strong id="savingCounter" aria-hidden="true">'+savingsMoney(paise)+'</strong></div></div><h2>'+stage[3]+(stage[1]?' · Age '+stage[1]:'')+'</h2>'+progress+'</div>'+
 '<p class="muted">Track how much of each bank balance you have set aside.</p><button class="button" onclick="openSaving(false)">＋ Add savings</button> '+(paise?'<button class="button ghost" onclick="openSaving(true)">Withdraw</button>':'')+
 '<h2>Saved by bank</h2>'+Array.from(savingsAccounts().values()).map(a=>'<div class="card row"><span>'+tidy(a.label)+'</span><strong>'+savingsMoney(a.amount)+'</strong></div>').join('')+'<details class="card"><summary>Baby to grandfather · All milestones</summary>'+growthStages.slice(1).map(s=>'<p>'+savingsPortrait(s)+' '+s[3]+' · Age '+s[1]+' · '+savingsMoney(s[0]*100)+(paise>=s[0]*100?' ✓':'')+'</p>').join('')+'</details><h2>Savings history</h2>'+(history||'<p class="muted">Your first saving will appear here.</p>');
}
function openSaving(withdraw){
 const title=withdraw?'Withdraw savings':'Add savings';
 const accounts=savingsAccounts();
 const choices=withdraw?Array.from(accounts.values()).filter(a=>a.amount>0):data.banks.map(b=>({id:String(b.id),label:b.name+(b.nick?' · '+b.nick:'')}));
 if(!choices.length){showSheet(title,'<p>Add a bank account to start saving.</p><button class="button" onclick="openBankPicker()">Add bank</button>');return;}
 const options=choices.map((a,i)=>'<option value="'+i+'">'+tidy(a.label)+(withdraw?' · '+savingsMoney(a.amount):'')+'</option>').join('');
 showSheet(title,'<form id="savingForm"><label class="field" for="savingBank">Bank account</label><select required class="input" id="savingBank"><option value="">Choose account</option>'+options+'</select><label class="field" for="savingAmount">Amount (₹)</label><input id="savingAmount" class="input" required type="number" inputmode="decimal" min="0.01" step="0.01"><button class="button">'+title+'</button></form>');
 document.getElementById('savingForm').onsubmit=event=>{
  event.preventDefault();
  const amount=Number(document.getElementById('savingAmount').value);
  const paise=Math.round(amount*100);
  if(!Number.isSafeInteger(paise)||paise<=0)return alert('Enter a valid amount.');
  const entries=data.savings||[];
  const choice=document.getElementById('savingBank').value;
  const bank=choices[Number(choice)];
  if(choice===''||!bank)return alert('Choose a bank account.');
  if(withdraw&&paise>(savingsAccounts().get(bank.id)?.amount||0))return alert('Amount exceeds savings in this account.');
  const before=growthState(entries).paise;
  const updated=[...entries,{bankId:bank.id,bankLabel:bank.label,paise:withdraw?-paise:paise,date:new Date().toISOString()}];
  if(!validSavings(updated))return alert('Amount exceeds the available balance or supported range.');
  const next={...data,savings:updated};
  try{localStorage.setItem(KEY,JSON.stringify(next));}catch(_){return alert('Could not save on this device.');}
  data=next;closeSheet();render();rollSavingsTotal(before,before+(withdraw?-paise:paise));
 };
}

let raw;try{raw=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(_){raw={}}
let data={savings:validSavings(raw.savings)?raw.savings:[],banks:Array.isArray(raw.banks)?raw.banks:[],entries:Array.isArray(raw.entries)?raw.entries:[],plans:Array.isArray(raw.plans)?raw.plans:[],loans:Array.isArray(raw.loans)?raw.loans:[],source:String(raw.source||''),exportedAt:String(raw.exportedAt||raw.originalSnapshotAt||''),linkedName:String(raw.linkedName||''),linkedEmail:String(raw.linkedEmail||'')};function openingTab(){return new URLSearchParams(location.search).get('section')==='savings'?'savings':'home'}
let tab=openingTab(),selectedBank=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert('Device storage is full; export a backup before adding more entries.');}render()}
function total(){return data.banks.reduce((sum,b)=>sum+(Number(b.balance)||0),0)}
function badge(name){const n=String(name||'');let bg=n.includes('Axis')?'#a3134f':n.includes('HDFC')?'#1269bd':n.includes('ICICI')?'#dc6019':n.includes('State Bank')?'#1596d3':n.includes('Canara')?'#00a5cc':n.includes('Punjab')?'#a51c54':n.includes('Baroda')?'#f37927':'#554bc1';let letters=n==='State Bank of India'?'SBI':n.split(/\s+/).map(s=>s[0]).join('').slice(0,3).toUpperCase();return '<div class="bank-symbol" style="background:'+bg+'">'+tidy(letters)+'</div>'}
function categoryIcon(name){return (cats[name]||cats.Other)[0]}
// Chart-free analytics from the current device's recorded money entries.
function analyticsDayKey(entry){
 const raw=String(entry.created||entry.when||entry.date||'');
 if(/^\d{4}-\d{2}-\d{2}/.test(raw))return raw.slice(0,10);
 const date=new Date(raw);
 if(!Number.isFinite(date.getTime()))return '';
 return [date.getFullYear(),String(date.getMonth()+1).padStart(2,'0'),String(date.getDate()).padStart(2,'0')].join('-');
}
function analyticsSnapshot(now=new Date()){
 const year=now.getFullYear(),month=now.getMonth(),day=now.getDate();
 const monthKey=[year,String(month+1).padStart(2,'0')].join('-');
 const today=monthKey+'-'+String(day).padStart(2,'0');
 const prevDate=new Date(year,month-1,1);
 const prevKey=[prevDate.getFullYear(),String(prevDate.getMonth()+1).padStart(2,'0')].join('-');
 const prevDays=new Date(year,month,0).getDate();
 const comparisonCutoff=prevKey+'-'+String(Math.min(day,prevDays)).padStart(2,'0');
 const monthly=data.entries.filter(e=>{
  const date=analyticsDayKey(e),type=String(e.type||'').toLowerCase();
  return date.startsWith(monthKey)&&date<=today&&['income','expense'].includes(type)&&Number.isFinite(Number(e.amount));
 });
 const previous=data.entries.filter(e=>analyticsDayKey(e).startsWith(prevKey)&&analyticsDayKey(e)<=comparisonCutoff&&String(e.type||'').toLowerCase()==='expense'&&Number.isFinite(Number(e.amount)));
 const sum=(entries,type)=>entries.filter(e=>String(e.type||'').toLowerCase()===type).reduce((acc,e)=>acc+Math.max(0,Number(e.amount)||0),0);
 const income=sum(monthly,'income'),expense=sum(monthly,'expense'),net=income-expense,prevExpense=sum(previous,'expense');
 const todaySpent=sum(monthly.filter(e=>analyticsDayKey(e)===today),'expense');
 const avgExpense=expense/Math.max(1,day);
 let deltaText='No previous spending',deltaClass='neutral',deltaHint='No expense baseline for the same days last month.';
 if(prevExpense>0){
  const pct=Math.round(Math.abs(expense-prevExpense)/prevExpense*100);
  deltaText=(expense>prevExpense?'↑ ':expense<prevExpense?'↓ ':'= ')+pct+'%';
  deltaClass=expense>prevExpense?'higher':expense<prevExpense?'lower':'neutral';
  deltaHint=expense>prevExpense?'Spending increased vs the same days last month.':expense<prevExpense?'Spending decreased vs the same days last month.':'Spending is unchanged vs the same days last month.';
 }else if(expense>0){deltaText='New spending';}
 return {income,expense,net,todaySpent,avgExpense,prevExpense,monthly,deltaText,deltaClass,deltaHint,
  monthLabel:now.toLocaleDateString('en-IN',{month:'long',year:'numeric'}),dayCount:day};
}
function analyticsHome(){
 const a=analyticsSnapshot(),netSign=a.net>=0?'positive':'negative';
 const cashLabel=a.net>=0?'+':'−';
 let html='<div class="section-head"><h2>✨ Money Analytics</h2><span class="pill">'+tidy(a.monthLabel)+'</span></div>';
 html+='<div class="analytics-panel"><div class="analytics-intro"><div><span class="analytics-eyebrow">💼 NET CASH FLOW · THIS MONTH</span><div class="analytics-amount '+netSign+'">'+cashLabel+fmt(Math.abs(a.net))+'</div><div class="analytics-hint">Income '+fmt(a.income)+' · Expenses '+fmt(a.expense)+'</div></div><div class="analytics-stamp">✨</div></div>';
 html+='<div class="analytics-grid">'+
  '<div class="analytics-metric"><span>💸 Spent today</span><strong>'+fmt(a.todaySpent)+'</strong></div>'+
  '<div class="analytics-metric"><span>📅 Daily average</span><strong>'+fmt(a.avgExpense)+'</strong></div>'+
  '<div class="analytics-metric"><span>🧾 This month</span><strong>'+a.monthly.length+' entries</strong></div>'+
  '<div class="analytics-metric"><span>↔ vs Last Month</span><strong class="'+a.deltaClass+'">'+tidy(a.deltaText)+'</strong></div>'+
  '</div><div class="analytics-footer"><span>'+tidy(a.deltaHint)+'</span><button type="button" data-analytics="details">View details →</button></div></div>';
 return html;
}
function analyticsDetails(){
 const a=analyticsSnapshot();
 const expenseItems=a.monthly.filter(e=>String(e.type||'').toLowerCase()==='expense');
 const categoryTotals={};
 for(const entry of expenseItems){const category=String(entry.category||'Other');categoryTotals[category]=(categoryTotals[category]||0)+Math.max(0,Number(entry.amount)||0);}
 const ranked=Object.entries(categoryTotals).sort((left,right)=>right[1]-left[1]);
 let content='<p class="muted">Summary for '+tidy(a.monthLabel)+' through today. Based on manual entries stored on this device; transfers excluded.</p>';
 content+='<div class="split"><div class="smallstat"><div class="muted">↙ Money received</div><strong class="value" style="color:#078a5b">'+fmt(a.income)+'</strong></div><div class="smallstat"><div class="muted">↗ Money spent</div><strong class="value" style="color:#d93d65">'+fmt(a.expense)+'</strong></div></div>';
 content+='<div class="card"><b>Net cash flow: '+(a.net>=0?'+':'−')+fmt(Math.abs(a.net))+'</b><p class="muted">'+tidy(a.deltaHint)+'</p><p class="muted">Last month (same dates): '+fmt(a.prevExpense)+' expenses</p></div>';
 content+='<h2>Biggest expenses this month</h2>';
 content+=ranked.length?ranked.slice(0,6).map(([name,amount],index)=>'<div class="card row"><div class="badge-icon">'+categoryIcon(name)+'</div><div class="grow"><div class="label">'+tidy(name)+'</div><div class="muted">#'+(index+1)+' expense category</div></div><div class="value">'+fmt(amount)+'</div></div>').join(''):'<div class="card empty">No recorded expenses this month yet.</div>';
 content+='<h2>Recent monthly entries</h2>';
 content+=a.monthly.length?a.monthly.slice().reverse().slice(0,8).map(e=>'<div class="card row"><div class="grow"><div class="label">'+tidy(e.category||e.type||'Entry')+'</div><div class="muted">'+tidy(e.note||analyticsDayKey(e)||'')+'</div></div><div class="value">'+(String(e.type||'').toLowerCase()==='income'?'+':'−')+fmt(Math.max(0,Number(e.amount)||0))+'</div></div>').join(''):'<div class="card empty">No entries for this month.</div>';
 showSheet('Money Analytics',content);
}
function home(){
const groups={};
for(const e of data.entries){if(e.type==='Expense'){const key=e.category||'Other';groups[key]=(groups[key]||0)+Number(e.amount||0)}}
const top=Object.entries(groups).sort((a,b)=>b[1]-a[1]);
const hasBank=data.banks.length>0;
const summary=analyticsSnapshot();
const inc=summary.income,exp=summary.expense;
let html='<div class="hero"><small>🏦 TOTAL BANK BALANCE</small><div class="balance">'+(hasBank?fmt(total()):'Add your bank')+'</div><div class="hero-footer"><span>'+data.banks.length+' accounts</span><span>My wallet</span></div></div>';
html+='<div class="split" style="margin:12px 0"><div class="smallstat"><div class="muted">↙ Income · This month</div><strong class="value" style="color:#08945a">'+fmt(inc)+'</strong></div><div class="smallstat"><div class="muted">↗ Expenses · This month</div><strong class="value" style="color:#df3e62">'+fmt(exp)+'</strong></div></div>';
html+='<div class="section-head"><h2>⚡ Quick Actions</h2><span class="pill">One-tap access</span></div>';
const actions=[['expense','💸','Add Expense','quick-purple'],['income','💰','Add Income','quick-green'],['transfer','🔁','Transfer','quick-blue'],['bank','🏦','Add Bank','quick-orange'],['history','🧾','History','quick-slate'],['loans','🪙','Loans & EMI','quick-pink']];
html+='<div class="quick-grid">'+actions.map(([id,icon,name,theme])=>'<button type="button" class="quick-tile '+theme+'" data-quick="'+id+'" aria-label="'+tidy(name)+'"><span class="quick-icon" aria-hidden="true">'+icon+'</span><span class="quick-name">'+name+'</span></button>').join('')+'</div>';
const journey=growthState(data.savings||[]);
html+='<button class="card row" style="width:100%;text-align:left" onclick="go(\'savings\')"><strong>'+savingsPortrait(journey.stage)+' Savings Journey</strong><span>'+savingsMoney(journey.paise)+' ›</span></button>';
html+=analyticsHome();
html+='<div class="section-head"><h2>🏆 Top Spends</h2><span class="pill">All-time expenses</span></div>';
if(!top.length)html+='<div class="card empty"><div class="symbol">🛍️</div><b>No expenses recorded yet</b><p class="muted">Use Add Expense to see your biggest spending categories here.</p></div>';
else{
const [firstCat,firstAmount]=top[0];
html+='<button type="button" class="spend-feature" data-spend="'+tidy(firstCat)+'" aria-label="View '+tidy(firstCat)+' spending details"><span class="feature-emoji">'+categoryIcon(firstCat)+'</span><span class="feature-body"><span class="feature-tag">🥇 #1 MOST SPENT</span><div class="feature-name">'+tidy(firstCat)+'</div><div class="feature-amt">'+fmt(firstAmount)+'</div><div class="feature-hint">Tap to view notes & expenses →</div></span></button>';
const others=top.slice(1,3);
if(others.length)html+='<div class="spend-grid">'+others.map(([category,amount],i)=>'<button type="button" class="spend-mini '+(i?'alt':'')+'" data-spend="'+tidy(category)+'" aria-label="View '+tidy(category)+' spending details"><div class="mini-top"><span>'+(i?'🥉 #3':'🥈 #2')+'</span><span>↗</span></div><div class="mini-emoji">'+categoryIcon(category)+'</div><div class="mini-name">'+tidy(category)+'</div><div class="mini-amount">'+fmt(amount)+'</div><div class="mini-hint">Tap for details</div></button>').join('')+'</div>';
}
return html;
}
function banksPage(){let out='<div class="section-head"><h2>🏦 My Banks</h2><button class="button" onclick="openBankPicker()">+ Add Bank</button></div><div class="hero"><small>TOTAL MANUALLY ENTERED BALANCE</small><div class="balance">'+(data.banks.length?fmt(total()):'Not set')+'</div><div class="hero-footer">'+data.banks.length+' accounts · Multiple accounts per bank supported</div></div>';if(!data.banks.length)return out+'<div class="card empty"><div class="symbol">🏛️</div><b>No banks added here yet</b><p class="muted">Your older bank records are still in the original D4 database.</p><button class="button" onclick="openBankPicker()">Choose Bank</button></div>';return out+'<h2>Bank Accounts</h2>'+data.banks.map(b=>'<button type="button" class="bank-card" data-bank-id="'+tidy(String(b.id))+'">'+badge(b.name)+'<div class="grow"><div class="label">'+tidy(b.name)+'</div><small>'+tidy(b.nick||'Account')+'</small></div><div class="price">'+fmt(b.balance)+'</div><span class="chev">›</span></button>').join('')}
function history(){let out='<div class="section-head"><h2>⇄ Transactions</h2><button class="button" onclick="openTransaction()">+ Add</button></div><div class="muted" style="margin:0 0 12px">Food, Family, Petrol, Movies and custom spending notes.</div>';if(!data.entries.length)return out+'<div class="card empty">🧾<p><b>No local history yet</b></p><p class="muted">Your old Google Sheets transactions do not automatically appear here.</p></div>';return out+data.entries.slice().reverse().map(e=>{const b=data.banks.find(b=>String(b.id)===String(e.bankId));return '<div class="card row"><div class="badge-icon">'+categoryIcon(e.category)+'</div><div class="grow"><div class="label">'+tidy(e.category)+'</div><div class="muted">'+tidy(e.note||'No note')+'</div><div class="muted">'+tidy(e.type==='Transfer'?(e.fromBank+' → '+e.toBank):(b?.name||e.bank||'Unassigned original entry'))+'</div></div><div class="right"><div class="value txamount '+(e.type==='Expense'?'expense':e.type==='Transfer'?'':'income')+'">'+(e.type==='Expense'?'−':e.type==='Transfer'?'⇄':'+')+fmt(e.amount)+'</div><div class="muted">'+tidy(new Date(e.created||e.when||Date.now()).toLocaleDateString('en-IN'))+'</div></div></div>'}).join('')}
function plans(){
 const ps=Array.isArray(data.plans)?data.plans:[];
 let html='<div class="section-head"><h2>🎯 Future Plans</h2></div><div class="card"><b>Plan Budgets & Goals</b><p class="muted">Your savings goals and future spending plans are stored here. Existing records are preserved locally.</p></div>';
 if(!ps.length)return html+'<div class="card empty">No future plans yet.</div>';
 return html+ps.map(p=>'<div class="card"><strong>🎯 '+tidy(p.name||'Unnamed Plan')+'</strong><p>Target: <b>'+fmt(p.target||0)+'</b> · Saved: '+fmt(p.saved||0)+'</p>'+(p.actualSpent?'<p>Spent: '+fmt(p.actualSpent)+'</p>':'')+(p.dueDate?'<div class="muted">Target date: '+tidy(String(p.dueDate).slice(0,10))+'</div>':'')+'</div>').join('');
}
function settings(){return '<h2>⚙ Settings & Backup</h2><div class="card"><b>🔗 Link your original D4 DIG UP account</b><p class="muted">For Android APK users moving to Brave: first verify your own old Gmail by OTP in the secure account migration bridge, download your full account JSON, then import it below. This is a <b>one-time local copy</b>, not automatic sync.</p><button class="button" onclick="startNativeMigration()">🔐 Verify old Gmail &amp; get backup</button><button class="button ghost" style="margin:8px 0 0 8px" onclick="document.getElementById(\'nativeRestore\').click()">📂 Import verified Android backup</button><input type="file" id="nativeRestore" accept=".json,application/json" class="hidden" onchange="importNativeAccount(this)"><p class="muted">The original Android APK and Google Sheets data remain unchanged. Import is blocked if this Brave browser already has records. Never share a Gmail OTP or your private backup file.</p>'+(data.linkedName?'<div class="pill">Local snapshot: '+tidy(data.linkedName)+'</div>':'')+'</div><div class="notice"><strong>🔒 Account separation</strong>This Brave/Safari web app is currently local to this browser. A verified Android backup can be imported once, but there is no live account login or automatic Android sync. Each person must use their own verified login in the original D4 app. Never import or share another user’s private backup.</div><div class="card"><b>Your data stays on this device</b><p class="muted">This public GitHub Pages site stores bank balances and transactions locally in this browser, not in your Google Sheet. Clearing Safari site data can erase local entries.</p><div class="row"><button class="button" onclick="exportBackup()">↓ Download Backup</button><button class="button ghost" onclick="document.getElementById(\'restore\').click()">↑ Import Old D4 Data</button></div><input type="file" id="restore" accept=".json,application/json" class="hidden" onchange="importBackup(this)"><p class="muted">Choose D4_Old_Data_3_Banks_7_Transactions.json from iPhone Files → Downloads. A file showing 0 banks and 0 transactions is the wrong backup. This imports a local snapshot only; it does not live sync.</p></div><div class="notice"><strong>Original D4 finance account</strong>Your older balances and history are on a separate Google Sheets-backed app. Use your previous D4 DIG UP login to access them; this iPhone quick-start is not a replacement database.</div>'}
function openLogout(){showSheet('Logout','<p>Log out of DIG UP on this device?</p><p class="muted">Your banks, transactions, loans and plans stay saved in this browser. This closes the local app; it does not sign out of the separate Android or Gmail verification service.</p><div class="row"><button type="button" class="button ghost" onclick="closeSheet()">Cancel</button><button type="button" class="button" onclick="logoutLocalApp()">Logout</button></div>')}
function logoutLocalApp(){try{localStorage.setItem(LOGOUT_KEY,'1')}catch(_){alert('Could not save logout. Please try again.');return;}loggedOut=true;selectedBank=null;tab='home';document.getElementById('sheet').innerHTML='';closeSheet();render();window.scrollTo({top:0,behavior:'instant'});document.querySelector('#view button').focus()}
function resumeLocalApp(){try{localStorage.removeItem(LOGOUT_KEY)}catch(_){alert('Could not reopen the app. Please try again.');return;}loggedOut=false;tab=openingTab();render()}
function go(next){tab=next;selectedBank=null;closeSheet();render();window.scrollTo({top:0,behavior:'instant'})}
function render(){document.body.classList.toggle('d4-logged-out',loggedOut);if(loggedOut){document.getElementById('nav').innerHTML='';document.getElementById('view').innerHTML='<section class="card" style="margin-top:32px;text-align:center"><h2>You’re logged out</h2><p class="muted">Your records are saved in this browser.</p><button type="button" class="button" onclick="resumeLocalApp()">Open on this device</button><p class="muted">This local app has no password or OTP sign-in yet. Anyone using this browser can reopen it.</p></section>';return;}document.getElementById('nav').innerHTML=tabs.map(([id,ic,label])=>'<button type="button" class="navbtn '+(id===tab?'active':'')+'" data-tab="'+tidy(id)+'"><span class="ico">'+ic+'</span>'+label+'</button>').join('');let html=tab==='savings'?savingsPage():tab==='home'?home():tab==='banks'?banksPage():tab==='transactions'?history():tab==='plans'?plans():tab==='loans'?loansPage():settings();document.getElementById('view').innerHTML=html}
function showSheet(title,inner){document.getElementById('sheet').innerHTML='<div class="sheet-head"><h2>'+tidy(title)+'</h2><button class="x" aria-label="Close" onclick="closeSheet()">×</button></div>'+inner;document.getElementById('overlay').classList.add('open')}
function closeSheet(){document.getElementById('overlay').classList.remove('open')}
function openSpendCategory(category){
const matches=data.entries.filter(e=>e.type==='Expense'&&String(e.category||'Other')===category).slice().reverse();
const sum=matches.reduce((a,e)=>a+Number(e.amount||0),0);
let content='<div class="hero"><small>SPENDING CATEGORY</small><div style="font-size:25px;margin:8px 0">'+categoryIcon(category)+' '+tidy(category)+'</div><div class="balance">'+fmt(sum)+'</div><small>'+matches.length+' expense entries · All time</small></div><h2>Expense History & Notes</h2>';
content+=matches.length?matches.map(e=>{const bank=data.banks.find(b=>String(b.id)===String(e.bankId));const date=new Date(e.created||e.when||0);const when=Number.isFinite(date.getTime())?date.toLocaleDateString('en-IN'):'Date unavailable';return '<div class="card row"><div class="grow"><div class="label">'+tidy(e.note||'No note provided')+'</div><div class="muted">'+tidy(bank?.name||e.bank||'Original entry')+' · '+tidy(when)+'</div></div><div class="value">'+fmt(e.amount)+'</div></div>'}).join(''):'<p class="muted">No spending entries in this category.</p>';
showSheet(category+' Spending',content);
}
function openBankPicker(){showSheet('Choose a Bank','<p class="muted">Search Indian banks. You can add unlimited accounts, including multiple accounts with the same bank.</p><input class="input" id="banksearch" placeholder="Search bank name" oninput="filterBankList(this.value)"><div class="listbank" id="banklist"></div><button class="button ghost" style="width:100%;margin-top:10px" onclick="chooseBank(\'Other Bank\')">My bank is not listed</button>');filterBankList('')}
function filterBankList(q){const items=catalog.filter(b=>b.toLowerCase().includes(q.trim().toLowerCase()));document.getElementById('banklist').innerHTML=items.map(b=>'<button type="button" data-bank-choice="'+tidy(b)+'">🏦 '+tidy(b)+'</button>').join('')||'<div class="empty">No matching bank. Choose “My bank is not listed”.</div>'}
function chooseBank(name){showSheet('Add Bank Account','<form id="addbank"><label class="field">Bank Name</label><input class="input" id="bankname" required maxlength="100" value="'+tidy(name==='Other Bank'?'':name)+'" placeholder="Bank name"><label class="field">Account nickname</label><input class="input" id="banknick" maxlength="70" placeholder="e.g. Salary account"><label class="field">Current existing balance (₹)</label><input class="input" id="bankbalance" type="number" step="0.01" required placeholder="Enter manually"><button class="button" type="submit" style="width:100%">Save Account</button></form>');document.getElementById('addbank').onsubmit=e=>{e.preventDefault();const b=document.getElementById('bankname').value.trim(),n=document.getElementById('banknick').value.trim(),v=Number(document.getElementById('bankbalance').value);if(!b||!Number.isFinite(v))return alert('Enter valid bank and balance');data.banks.push({id:String(Date.now())+'-'+Math.random().toString(36).slice(2),name:b,nick:n,balance:v});closeSheet();tab='banks';save()}}
function openBankDetail(id){const b=data.banks.find(b=>String(b.id)===String(id));if(!b)return;let own=data.entries.filter(e=>String(e.bankId)===String(id));showSheet(b.name,'<div class="hero"><small>THIS ACCOUNT ONLY</small><div class="balance">'+fmt(b.balance)+'</div><small>'+tidy(b.nick||'Account')+'</small></div><h2>Edit Existing Balance</h2><form id="editbank"><label class="field">New current balance (₹)</label><input class="input" type="number" step="0.01" required id="newbalance" value="'+Number(b.balance)+'"><button class="button" type="submit">Update this account</button></form><button type="button" class="button ghost" id="removeBank">Remove account</button><h2>Account Transactions</h2>'+(own.length?own.slice().reverse().map(e=>'<div class="card row"><div>'+categoryIcon(e.category)+' '+tidy(e.category)+'<div class="muted">'+tidy(e.note||'No note')+'</div></div><b>'+fmt(e.amount)+'</b></div>').join(''):'<p class="muted">No transactions recorded for this account.</p>'));document.getElementById('removeBank').onclick=()=>{
 const label=b.name+(b.nick?' · '+b.nick:'');
 if(!confirm('Remove '+label+' from My Banks? Its balance ('+fmt(b.balance)+') will be excluded from your total. Past transactions and EMI history stay saved.'))return;
 for(const entry of own)if(!entry.bank)entry.bank=label;
 data.banks=data.banks.filter(account=>account!==b);
 selectedBank=null;closeSheet();save();
};document.getElementById('editbank').onsubmit=e=>{e.preventDefault();const val=Number(document.getElementById('newbalance').value);if(!Number.isFinite(val))return alert('Invalid amount');b.balance=val;closeSheet();save()}}
function openTransaction(initialType='Expense'){if(!data.banks.length){alert('Add a bank account first.');openBankPicker();return;}showSheet('Add Transaction','<form id="txform"><label class="field">Bank Account</label><select class="input" id="txbank">'+data.banks.map(b=>'<option value="'+tidy(String(b.id))+'">'+tidy(b.name+' — '+(b.nick||'Account'))+'</option>').join('')+'</select><label class="field">Transaction Type</label><select class="input" id="txtype"><option>Expense</option><option>Income</option></select><label class="field">For what?</label><select class="input" id="txcat">'+Object.keys(cats).map(k=>'<option value="'+tidy(k)+'">'+categoryIcon(k)+' '+tidy(k)+'</option>').join('')+'</select><label class="field">Amount (₹)</label><input class="input" type="number" id="txamount" min="0.01" step="0.01" placeholder="Amount" required><label class="field">Notes · What did you spend on?</label><textarea class="input" id="txnote" maxlength="500" placeholder="e.g. Lunch with family"></textarea><button class="button" type="submit" style="width:100%">Save Transaction</button></form>');document.getElementById('txtype').value=initialType==='Income'?'Income':'Expense';document.getElementById('txform').onsubmit=e=>{e.preventDefault();const id=document.getElementById('txbank').value,b=data.banks.find(b=>String(b.id)===id),amount=Number(document.getElementById('txamount').value),type=document.getElementById('txtype').value,category=document.getElementById('txcat').value,note=document.getElementById('txnote').value.trim();if(!b||!Number.isFinite(amount)||amount<=0)return alert('Invalid transaction');b.balance=Number(b.balance)+(type==='Expense'?-amount:amount);data.entries.push({bankId:b.id,type,amount,category,note,created:new Date().toISOString()});closeSheet();tab='transactions';save()}}
function openTransfer(){
if(data.banks.length<2){alert('Add two bank accounts to transfer between your accounts.');openBankPicker();return;}
const opts=data.banks.map(b=>'<option value="'+tidy(String(b.id))+'">'+tidy(b.name+' — '+(b.nick||'Account'))+'</option>').join('');
showSheet('Transfer Between Banks','<p class="muted">Moves your manual balance between two accounts. No real money will be transferred.</p><form id="transferform"><label class="field">From account</label><select class="input" id="frombank">'+opts+'</select><label class="field">To account</label><select class="input" id="tobank">'+opts+'</select><label class="field">Amount (₹)</label><input class="input" type="number" min="0.01" step="0.01" required id="transferamount"><label class="field">Notes (optional)</label><textarea class="input" id="transfernote" maxlength="500"></textarea><button type="submit" class="button" style="width:100%">Save Transfer</button></form>');
document.getElementById('tobank').selectedIndex=1;
document.getElementById('transferform').onsubmit=e=>{
e.preventDefault();
const fromId=document.getElementById('frombank').value,toId=document.getElementById('tobank').value;
const from=data.banks.find(b=>String(b.id)===fromId),to=data.banks.find(b=>String(b.id)===toId);
const amount=Number(document.getElementById('transferamount').value);
const note=document.getElementById('transfernote').value.trim();
if(!from||!to||fromId===toId||!Number.isFinite(amount)||amount<=0){alert('Choose two different bank accounts and enter a valid amount.');return;}
if(Number(from.balance)<amount&&!confirm('This transfer will make the source bank balance negative. Continue?'))return;
from.balance=Number(from.balance)-amount;to.balance=Number(to.balance)+amount;
data.entries.push({id:'local-transfer-'+Date.now(),bankId:from.id,toBankId:to.id,bank:from.name,fromBank:from.name,toBank:to.name,type:'Transfer',amount,category:'Transfer',note,created:new Date().toISOString()});
closeSheet();tab='transactions';save();
};
}
function exportBackup(){const json=JSON.stringify({format:'d4webv15',version:3,savings:data.savings||[],exportedAt:new Date().toISOString(),banks:data.banks,entries:data.entries,plans:data.plans,loans:data.loans,source:data.source,originalSnapshotAt:data.exportedAt,linkedName:data.linkedName,linkedEmail:data.linkedEmail},null,2);const url=URL.createObjectURL(new Blob([json],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='D4-DIG-UP-iPhone-Backup.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}
async function importBackup(input){const file=input.files?.[0];if(!file)return;try{if(file.size>5e6)throw Error('Backup exceeds 5 MB');const parsed=JSON.parse(await file.text());if(parsed.format!=='d4webv15'||!Array.isArray(parsed.banks)||!Array.isArray(parsed.entries))throw Error('Not a compatible D4 import file');const savings=parsed.savings===undefined?[]:parsed.savings;if(!validSavings(savings))throw Error('Invalid savings history');const newBanks=parsed.banks.map(b=>({id:String(b.id),name:String(b.name),nick:String(b.nick||''),balance:Number(b.balance)}));const newEntries=parsed.entries.map(e=>({...e,bankId:String(e.bankId||''),amount:Number(e.amount)}));if(!savings.length&&!newBanks.length&&!newEntries.length&&!parsed.loans?.length&&!parsed.plans?.length)throw Error('Selected file contains 0 banks and 0 transactions. No changes were made. Select D4_Old_Data_3_Banks_7_Transactions.json from iPhone Files → Downloads instead of an empty Safari backup.');if(newBanks.some(b=>!b.id||!b.name||!Number.isFinite(b.balance))||newEntries.some(e=>!Number.isFinite(e.amount)||e.amount<0))throw Error('Invalid values in backup');if(data.savings?.length||data.banks.length||data.entries.length||data.loans?.length||data.plans?.length){if(!confirm('File: '+file.name+'\\nFound '+newBanks.length+' banks, '+newEntries.length+' transactions, '+(parsed.loans||[]).length+' loans and '+(parsed.plans||[]).length+' plans.\\nThis will REPLACE your current local records including savings. Download a Backup in Settings first if you want to preserve them. The old Google Sheets data will not change. Continue?'))return;}else if(!confirm('File: '+file.name+'\\nRestore '+newBanks.length+' original banks, '+newEntries.length+' transactions, '+(parsed.loans||[]).length+' loans and '+(parsed.plans||[]).length+' plans on this iPhone? Your Google Sheet will not change.'))return;data={savings,banks:newBanks,entries:newEntries,plans:Array.isArray(parsed.plans)?parsed.plans:[],loans:Array.isArray(parsed.loans)?parsed.loans:[],source:String(parsed.source||''),exportedAt:String(parsed.exportedAt||parsed.originalSnapshotAt||'')};save();alert('Restored '+newBanks.length+' banks, '+newEntries.length+' transactions, '+data.loans.length+' loans and '+data.plans.length+' plans. This is a local snapshot, not live sync.')}catch(e){alert('Could not restore: '+e.message)}finally{input.value=''}}

// Stable click handlers: avoid broken quoted inline handlers for dynamically named items.
document.getElementById('nav').addEventListener('click',e=>{const target=e.target.closest('[data-tab]');if(target){e.preventDefault();go(target.dataset.tab)}});
document.getElementById('view').addEventListener('click',e=>{
const loan=e.target.closest('[data-loan-action]');
if(loan){e.preventDefault();handleLoanAction(loan.dataset.loanAction,loan.dataset.loanId);return;}
const analytics=e.target.closest('[data-analytics]');

const quick=e.target.closest('[data-quick]');
if(quick){e.preventDefault();switch(quick.dataset.quick){
case 'expense':openTransaction('Expense');break;
case 'income':openTransaction('Income');break;
case 'transfer':openTransfer();break;
case 'bank':openBankPicker();break;
case 'history':go('transactions');break;
case 'loans':go('loans');break;
}return;}
const target=e.target.closest('[data-bank-id]');
if(target){e.preventDefault();openBankDetail(target.dataset.bankId)}
});
document.getElementById('sheet').addEventListener('click',e=>{const loan=e.target.closest('[data-loan-action]');if(loan){e.preventDefault();handleLoanAction(loan.dataset.loanAction,loan.dataset.loanId,loan.dataset.paymentId);return;}const target=e.target.closest('[data-bank-choice]');if(target){e.preventDefault();chooseBank(target.dataset.bankChoice)}});
document.getElementById('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeSheet()});render();
