/* Spotlight cards: strong contrast, clear type and large tap targets */
.quick-tile{min-height:108px;border-width:1.5px;box-shadow:0 6px 16px #29305b12}
.quick-icon{width:50px;height:50px;font-size:27px;box-shadow:0 3px 8px #18133615}
.quick-name{font-size:12px;font-weight:850}
.quick-purple{background:#f4eafe;border-color:#e4cefb;color:#5e208d}.quick-purple .quick-icon{background:#e9cefc}
.quick-green{background:#e2f8ed;border-color:#bce6d0;color:#0c6d4b}.quick-green .quick-icon{background:#baf0d1}
.quick-blue{background:#e5f0ff;border-color:#c7dcff;color:#1758a5}.quick-blue .quick-icon{background:#bcd6ff}
.quick-orange{background:#fff0dd;border-color:#f7d9ad;color:#995a0e}.quick-orange .quick-icon{background:#ffe0ae}
.quick-slate{background:#e9edfa;border-color:#d2ddf1;color:#394778}.quick-slate .quick-icon{background:#cfdbf4}
.quick-pink{background:#ffe8f0;border-color:#f7cbda;color:#a12462}.quick-pink .quick-icon{background:#f8c2d7}
.spend-feature{width:100%;display:flex;align-items:center;gap:14px;padding:17px;text-align:left;color:#602610;background:linear-gradient(120deg,#ffe9cb,#ffcf9f);border:1px solid #f1ba86;border-radius:22px;box-shadow:0 6px 19px #b772421a;margin-bottom:10px;touch-action:manipulation}
.spend-feature .feature-emoji{font-size:37px;display:grid;place-items:center;width:75px;height:75px;flex-shrink:0;border-radius:21px;background:#ffffff82}
.feature-body{flex:1;min-width:0}.feature-tag{font-size:10px;letter-spacing:.5px;font-weight:900;text-transform:uppercase;color:#96541c}
.feature-name{font-size:19px;font-weight:900;margin:4px 0}.feature-amt{font-size:23px;letter-spacing:-.4px;font-weight:900;font-variant-numeric:tabular-nums}.feature-hint{font-size:11px;color:#7c542f;margin-top:5px}
.spend-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:16px}
.spend-mini{background:#e9e7ff;border:1px solid #c9c5fa;border-radius:19px;text-align:left;padding:14px 11px;color:#33256d;display:flex;flex-direction:column;min-width:0;min-height:152px;touch-action:manipulation}
.spend-mini.alt{background:#dff8f3;border-color:#afe6db;color:#116b5b}
.spend-mini .mini-top{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:900}
.spend-mini .mini-emoji{font-size:32px;margin:10px 0 8px}.spend-mini .mini-name{font-size:13px;font-weight:800;overflow-wrap:anywhere}
.spend-mini .mini-amount{font-size:17px;font-weight:900;margin-top:5px;white-space:nowrap;font-variant-numeric:tabular-nums;letter-spacing:-.45px}
.spend-mini .mini-hint{font-size:10px;margin-top:4px;opacity:.8}
.spend-feature:active,.spend-mini:active{transform:scale(.985)}
.quick-tile:focus-visible,.spend-feature:focus-visible,.spend-mini:focus-visible{outline:3px solid #6553e2;outline-offset:3px}

/* Six-tab iOS navigation and loan management */
.bottom{gap:2px;padding-left:5px;padding-right:5px}
.navbtn{font-size:9px;padding:8px 1px;min-width:0;gap:5px}
.navbtn .ico{font-size:20px}
.loan-hero{background:linear-gradient(118deg,#151d42,#38369e 63%,#7460df);padding:22px;border-radius:22px;color:white;margin:10px 0 12px}
.loan-hero-meta{font-size:11px;opacity:.8;font-weight:850;letter-spacing:1px}
.loan-hero-total{font-size:30px;font-weight:900;letter-spacing:-1px;margin:8px 0 15px;overflow-wrap:anywhere}
.loan-hero-foot{display:flex;justify-content:space-between;font-size:12px;opacity:.8}
.loan-caption{font-size:12px;line-height:1.55;color:#6e748e;margin:12px 1px 17px}
.loan-card{background:white;border:1px solid #e5e7f4;border-radius:22px;padding:17px;margin:13px 0;box-shadow:0 6px 17px #20245a0c}
.loan-card-head{display:flex;gap:12px;align-items:center}
.loan-symbol{display:grid;place-items:center;background:#ece8ff;border-radius:15px;width:48px;height:48px;font-size:25px}
.loan-title{font-size:17px;font-weight:850;color:#252545}
.loan-small-btn{background:#eeeafe;color:#543cb7;padding:9px 11px;border-radius:11px;font-size:12px;font-weight:800}
.loan-balance-label{font-weight:850;font-size:10px;letter-spacing:1px;color:#7f839d;margin-top:23px}
.loan-balance{font-size:27px;font-weight:900;color:#2d2465;margin-top:6px}
.loan-stats{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:16px}
.loan-stats>div{background:#f5f4ff;border-radius:13px;padding:12px 10px}
.loan-stats small{display:block;color:#737b95;font-size:11px}
.loan-stats strong{display:block;color:#273351;font-size:15px;margin-top:7px}
.loan-bottom{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:#727a91;font-size:11px;margin-top:14px}
.loan-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:17px}
.loan-actions button{padding:12px 8px;border-radius:12px;font-size:12px;font-weight:800}
.loan-pay{background:#5444dc;color:white}
.loan-history{background:#e7eafd;color:#4338ab}

/* EMI reminder dashboard */
.loan-summary-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:13px 0}
.loan-summary-stat{background:#fff;border:1px solid #e3e5f6;border-radius:17px;padding:12px 8px;min-width:0;box-shadow:0 3px 10px #25256907}
.loan-summary-stat span{display:block;font-size:10px;font-weight:800;color:#737794}
.loan-summary-stat strong{display:block;font-size:15px;font-weight:900;color:#302867;margin-top:9px;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.loan-summary-attention{background:#fff0ee;border-color:#f5beba}.loan-summary-attention strong{color:#b52932}
.loan-alert{background:#fff0ec;border:1px solid #f5c3ba;border-radius:18px;padding:15px;margin:14px 0}
.loan-alert-title{font-weight:850;color:#9e2525;font-size:14px;margin-bottom:10px}
.loan-alert-line{display:flex;justify-content:space-between;gap:8px;font-size:12px;margin:8px 0;color:#7f3d2f}
.loan-alert-line strong{font-variant-numeric:tabular-nums;white-space:nowrap}
.loan-alert .loan-caption{margin:10px 0 0}
.loan-setup-note{background:#f3f0ff;color:#51458e;border:1px solid #dcd4f8;border-radius:17px;padding:13px 14px;line-height:1.6;font-size:12px;margin-top:13px}
.loan-upcoming{background:#fff;border-radius:17px;border:1px solid #e4e6f5;padding:3px 13px;margin-bottom:15px}
.loan-upcoming-row{display:flex;align-items:center;gap:11px;border-bottom:1px solid #eef0f9;padding:13px 0}
.loan-upcoming-row:last-child{border-bottom:0}.loan-upcoming-row strong{font-size:12px;color:#343055}
.loan-calendar-icon{width:40px;height:40px;border-radius:13px;background:#e9e7ff;display:grid;place-items:center;flex-shrink:0;font-size:21px}
.loan-upcoming-right{text-align:right;display:flex;align-items:flex-end;flex-direction:column;gap:6px;flex-shrink:0}
.loan-upcoming-right button{background:#eae7ff;color:#493ab0;border-radius:9px;padding:6px 10px;font-size:11px;font-weight:800}
.loan-status{display:inline-flex;border-radius:999px;padding:6px 10px;margin-top:16px;background:#edf0f8;color:#5f647a;font-weight:800;font-size:11px}
.loan-status.danger{background:#ffe7e4;color:#ac2931}.loan-status.today{background:#ffedcc;color:#955a17}
.loan-status.soon{background:#e7efff;color:#2452a6}.loan-status.setup{background:#efeaff;color:#5b45ad}
.loan-status.paid{background:#d9f6e9;color:#0b774c;border:1px solid #a6e5c5}
.loan-status.upcoming{background:#e7efff;color:#2452a6}
.loan-status.neutral{background:#e9edf2;color:#56617c}

/* Chart-free home analytics */
.analytics-panel{background:#fff;border:1px solid #dddff6;border-radius:22px;padding:17px;box-shadow:0 7px 22px #2934870c;margin-bottom:17px}
.analytics-intro{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:13px;border-bottom:1px solid #eeeef8}
.analytics-eyebrow{font-size:10px;font-weight:900;letter-spacing:.65px;color:#77749a}
.analytics-amount{font-size:29px;letter-spacing:-.8px;font-weight:950;margin:9px 0 5px;overflow-wrap:anywhere}
.analytics-amount.positive{color:#0b8860}.analytics-amount.negative{color:#d34465}
.analytics-hint{font-size:11px;color:#7c829a;line-height:1.5}
.analytics-stamp{flex-shrink:0;width:49px;height:49px;background:#eee9ff;border-radius:17px;display:grid;place-items:center;font-size:27px}
.analytics-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:13px}
.analytics-metric{min-width:0;border-radius:15px;background:#f5f3ff;padding:13px 11px}
.analytics-metric:nth-child(2){background:#eaf9f4}.analytics-metric:nth-child(3){background:#fdf2e5}.analytics-metric:nth-child(4){background:#eef3ff}
.analytics-metric span{display:block;color:#6c7190;font-weight:800;font-size:11px}
.analytics-metric strong{display:block;color:#262650;font-size:17px;font-weight:900;margin-top:7px;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.analytics-metric strong.higher{color:#c94e4e}.analytics-metric strong.lower{color:#087f56}.analytics-metric strong.neutral{font-size:13px;color:#6a6591}
.analytics-footer{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px}
.analytics-footer span{color:#8687a1;font-size:10px;line-height:1.5;max-width:65%}
.analytics-footer button{border-radius:11px;background:#eee9ff;color:#4d3bae;padding:10px 12px;font-weight:850;font-size:11px;white-space:nowrap}
.analytics-footer button:active{transform:scale(.97)}

<script>
'use strict';
// This app is intentionally local-only; no finance data is sent to the public GitHub repository.
const LOGOUT_KEY='d4-local-logged-out-v1';
let loggedOut=false;try{loggedOut=localStorage.getItem(LOGOUT_KEY)==='1'}catch(_){}
const KEY='d4webv15', fmt=n=>'₹'+Number(n).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}), tidy=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const catalog=['State Bank of India','HDFC Bank','ICICI Bank','Axis Bank','Punjab National Bank','Bank of Baroda','Canara Bank','Union Bank of India','Indian Bank','Bank of India','Indian Overseas Bank','UCO Bank','Central Bank of India','Bank of Maharashtra','Punjab & Sind Bank','Kotak Mahindra Bank','Federal Bank','IDFC FIRST Bank','IndusInd Bank','YES BANK','RBL Bank','Bandhan Bank','DCB Bank','City Union Bank','Karur Vysya Bank','Tamilnad Mercantile Bank','South Indian Bank','Karnataka Bank','CSB Bank','Jammu & Kashmir Bank','Nainital Bank','Dhanlaxmi Bank','AU Small Finance Bank','Equitas Small Finance Bank','Ujjivan Small Finance Bank','Utkarsh Small Finance Bank','Suryoday Small Finance Bank','ESAF Small Finance Bank','Jana Small Finance Bank','Shivalik Small Finance Bank','Capital Small Finance Bank','Airtel Payments Bank','India Post Payments Bank','Fino Payments Bank','Jio Payments Bank'];
const cats={Food:['🍔','#fa9e48'],Family:['👨‍👩‍👧','#6d7dff'],Petrol:['⛽','#ef5d62'],Movies:['🎬','#9059d7'],Shopping:['🛍️','#f58ab1'],Travel:['🚗','#54aaf5'],Bills:['🧾','#3dbb97'],Other:['📦','#9295ab']};
const tabs=[['home','⌂','Home'],['banks','▣','Banks'],['transactions','⇄','Spends'],['plans','◈','Plans'],['savings','🌱','Savings'],['loans','🪙','Loans'],['pluxee','▤','Pluxee'],['settings','⚙','Settings']];

// Each row is a savings threshold in rupees and a Fibonacci age.
const growthStages = [
 [0,0,'🌱','Starting out'],[10,1,'👶','Baby'],[1000,2,'🧒','Toddler'],
 [1010,3,'🧒','Little explorer'],[2010,5,'👦','School kid'],[3020,8,'👦','Growing kid'],
 [5030,13,'🧑','Teenager'],[8050,21,'👨','Young man'],[13080,34,'👨🏻‍💼','Adult'],
 [21130,55,'🧔','Older adult'],[34210,89,'👴','Grandfather']
];
function growthState(entries){
 const paise=entries.reduce((n,e)=>n+e.paise,0);
 const index=growthStages.filter(s=>paise>=s[0]*100).length-1;
 return {paise,stage:growthStages[index],next:growthStages[index+1]};
}
function validSavings(entries){
 if(!Array.isArray(entries))return false;
 let balance=0;
 return entries.every(e=>e&&Number.isSafeInteger(e.paise)&&e.paise!==0
  &&typeof e.date==='string'&&Number.isFinite(Date.parse(e.date))
  &&Number.isSafeInteger(balance+=e.paise)&&balance>=0);
}
function savingsMoney(paise){
 return '₹'+(paise/100).toLocaleString('en-IN',{maximumFractionDigits:2});
}
function savingsPortrait(stage,large=false){
 const cell=growthStages.indexOf(stage);
 return '<span class="savings-portrait'+(large?' large':'')+'" aria-hidden="true" style="--x:'+((cell%4)*100/3)+'%;--y:'+(Math.floor(cell/4)*50)+'%"></span>';
}

function savingsAccounts(){
 const accounts=new Map();
 for(const entry of data.savings||[]){
  const id=String(entry.bankId||'');
  if(!accounts.has(id))accounts.set(id,{id,label:entry.bankLabel||'Earlier savings · bank unspecified',amount:0});
  accounts.get(id).amount+=entry.paise;
 }
 return accounts;
}
function rollSavingsTotal(from,to){
 const display=document.getElementById('savingCounter');
 if(!display||window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 const final=savingsMoney(to),previous=savingsMoney(from).replace(/\D/g,'').split('').reverse();
 let offset=final.replace(/\D/g,'').length;
 display.innerHTML=Array.from(final,c=>{
  if(!/\d/.test(c))return c;
  const first=Number(previous[--offset]||0),steps=10+(Number(c)-first+10)%10;
  const strip=Array.from({length:steps+1},(_,i)=>'<i>'+((first+i)%10)+'</i>').join('');
  return '<span class="saving-wheel"><span style="--travel:-'+steps+'em;--duration:'+(650+Math.min(offset,6)*70)+'ms">'+strip+'</span></span>';
 }).join('');
 setTimeout(()=>{if(display.isConnected)display.textContent=final;},1150);
}
function savingsPage(){
 const entries=data.savings||[],{paise,stage,next}=growthState(entries);
 const history=entries.slice().reverse().map(e=>'<div class="card row"><span>'+tidy(new Date(e.date).toLocaleDateString('en-IN'))+'<br><small>'+tidy(e.bankLabel||'Earlier savings · bank unspecified')+'</small></span><strong>'+ (e.paise>0?'+':'−')+savingsMoney(Math.abs(e.paise))+'</strong></div>').join('');
 const progress=next?'<progress aria-label="Progress to next age" style="width:100%" value="'+(paise-stage[0]*100)+'" max="'+((next[0]-stage[0])*100)+'"></progress><p>'+savingsMoney(next[0]*100-paise)+' to age '+next[1]+' · '+next[3]+'</p>':'<p>Grandfather milestone reached 🎉</p>';
 return '<button class="button ghost" onclick="go(\'home\')">‹ Home</button><h2>Savings Journey</h2><div class="hero"><div class="saving-picture">'+savingsPortrait(stage,true)+'<div class="saving-dial" aria-label="Total saved '+savingsMoney(paise)+'"><small>TOTAL SAVED</small><strong id="savingCounter" aria-hidden="true">'+savingsMoney(paise)+'</strong></div></div><h2>'+stage[3]+(stage[1]?' · Age '+stage[1]:'')+'</h2>'+progress+'</div>'+
 '<p class="muted">Track how much of each bank balance you have set aside.</p><button class="button" onclick="openSaving(false)">＋ Add savings</button> '+(paise?'<button class="button ghost" onclick="openSaving(true)">Withdraw</button>':'')+
 '<h2>Saved by bank</h2>'+Array.from(savingsAccounts().values()).map(a=>'<div class="card row"><span>'+tidy(a.label)+'</span><strong>'+savingsMoney(a.amount)+'</strong></div>').join('')+'<details class="card"><summary>Baby to grandfather · All milestones</summary>'+growthStages.slice(1).map(s=>'<p>'+savingsPortrait(s)+' '+s[3]+' · Age '+s[1]+' · '+savingsMoney(s[0]*100)+(paise>=s[0]*100?' ✓':'')+'</p>').join('')+'</details><h2>Savings history</h2>'+(history||'<p class="muted">Your first saving will appear here.</p>');
}
function openSaving(withdraw){
 const title=withdraw?'Withdraw savings':'Add savings';
 const accounts=savingsAccounts();
 const choices=withdraw?Array.from(accounts.values()).filter(a=>a.amount>0):data.banks.map(b=>({id:String(b.id),label:b.name+(b.nick?' · '+b.nick:'')}));
 if(!choices.length){showSheet(title,'<p>Add a bank account to start saving.</p><button class="button" onclick="openBankPicker()">Add bank</button>');return;}
 const options=choices.map((a,i)=>'<option value="'+i+'">'+tidy(a.label)+(withdraw?' · '+savingsMoney(a.amount):'')+'</option>').join('');
 showSheet(title,'<form id="savingForm"><label class="field" for="savingBank">Bank account</label><select required class="input" id="savingBank"><option value="">Choose account</option>'+options+'</select><label class="field" for="savingAmount">Amount (₹)</label><input id="savingAmount" class="input" required type="number" inputmode="decimal" min="0.01" step="0.01"><button class="button">'+title+'</button></form>');
 document.getElementById('savingForm').onsubmit=event=>{
  event.preventDefault();
  const amount=Number(document.getElementById('savingAmount').value);
  const paise=Math.round(amount*100);
  if(!Number.isSafeInteger(paise)||paise<=0)return alert('Enter a valid amount.');
  const entries=data.savings||[];
  const choice=document.getElementById('savingBank').value;
  const bank=choices[Number(choice)];
  if(choice===''||!bank)return alert('Choose a bank account.');
  if(withdraw&&paise>(savingsAccounts().get(bank.id)?.amount||0))return alert('Amount exceeds savings in this account.');
  const before=growthState(entries).paise;
  const updated=[...entries,{bankId:bank.id,bankLabel:bank.label,paise:withdraw?-paise:paise,date:new Date().toISOString()}];
  if(!validSavings(updated))return alert('Amount exceeds the available balance or supported range.');
  const next={...data,savings:updated};
  try{localStorage.setItem(KEY,JSON.stringify(next));}catch(_){return alert('Could not save on this device.');}
  data=next;closeSheet();render();rollSavingsTotal(before,before+(withdraw?-paise:paise));
 };

 const prevDays=new Date(year,month,0).getDate();
 const comparisonCutoff=prevKey+'-'+String(Math.min(day,prevDays)).padStart(2,'0');

  const date=analyticsDayKey(e),type=String(e.type||'').toLowerCase();

function pxPaise(value){
 if(value==null||String(value).trim()==='')throw Error('Enter an amount.');
 const amount=Number(value),paise=Math.round(amount*100);
 if(!Number.isFinite(amount)||Math.abs(amount)>1e11||Math.abs(paise/100-amount)>0.000001)throw Error('Enter a valid amount with up to two decimal places.');
 return paise;
}
function pxWriteWallet(bankId,amountPaise,entry){
 const banks=data.banks.slice();
 let index=banks.findIndex(b=>isPluxeeAccount(b)&&String(b.id)===String(bankId));
 if(index<0&&bankId!=null)throw Error('Wallet changed. Reopen Pluxee.');
 const bank=index<0?{id:crypto.randomUUID(),name:'Pluxee',nick:'Meal wallet',balance:0}:{...banks[index]};
 const previous=pxPaise(bank.balance);
 const nextPaise=entry?previous+(entry.type==='Income'?amountPaise:-amountPaise):amountPaise;
 bank.balance=pxPaise(nextPaise/100)/100;
 if(index<0)banks.push(bank);else banks[index]=bank;
 const entries=entry?data.entries.concat({...entry,amount:amountPaise/100,bankId:bank.id}):data.entries;
 const next={...data,banks,entries};
 try{localStorage.setItem(KEY,JSON.stringify(next))}catch(_){throw Error('Could not save on this device. Please retry.')}
 data=next;
}

oans)?parsed.loans:[],source:String(parsed.source||''),exportedAt:String(parsed.exportedAt||parsed.originalSnapshotAt||'')};save();alert('Restored '+newBanks.length+' banks, '+newEntries.length+' transactions, '+data.loans.length+' loans and '+data.plans.length+' plans. This is a local snapshot, not live sync.')}catch(e){alert('Could not restore: '+e.message)}finally{input.value=''}}
