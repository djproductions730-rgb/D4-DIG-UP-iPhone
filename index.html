<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#4537a8"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="D4 DIG UP"><link rel="manifest" href="./manifest.webmanifest"><title>D4 DIG UP</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f5f4fc;color:#1a2440;margin:0;padding:env(safe-area-inset-top) 18px 48px}header{background:linear-gradient(125deg,#252d96,#7354ed);color:white;border-radius:0 0 24px 24px;margin:0 -18px;padding:26px 22px}h1{margin:0 0 12px}button,input,select{font:inherit;border-radius:12px;padding:12px;border:1px solid #d5d8e5}button{background:#5042ce;color:#fff;border:0;cursor:pointer}.card{background:#fff;padding:17px;border-radius:18px;margin:14px 0;box-shadow:0 3px 14px #1a146008}.row{display:flex;gap:9px;align-items:center;justify-content:space-between}.row>*{min-width:0}nav{display:flex;justify-content:space-around;padding:12px;background:#fff;position:sticky;bottom:0;border-radius:16px}nav button{font-size:12px;padding:10px}small{color:#69718b}.amt{font-size:30px;font-weight:800}input,select{max-width:100%;box-sizing:border-box;background:#fff;color:#171c35}label{display:block;margin:12px 0 5px} .bar{height:9px;border-radius:9px;background:#edeafa;overflow:hidden}.bar span{height:100%;display:block;background:#6954df}.sub{font-size:13px;color:#68718f}</style></head><body><header><h1>D4 DIG UP</h1><div>Total Bank Balance</div><div class="amt" id="total">₹0.00</div><small style="color:#ddd">Manually managed · Stored on this device</small></header><main id="screen"></main><nav><button onclick="show('home')">⌂ Home</button><button onclick="show('banks')">▣ Banks</button><button onclick="show('tx')">▤ History</button></nav><script>
const catalogue=['State Bank of India','HDFC Bank','ICICI Bank','Axis Bank','Punjab National Bank','Bank of Baroda','Canara Bank','Union Bank of India','Indian Bank','Bank of India','Indian Overseas Bank','UCO Bank','Kotak Mahindra Bank','Federal Bank','IDFC FIRST Bank','IndusInd Bank','YES BANK','Tamilnad Mercantile Bank','Karur Vysya Bank','City Union Bank','AU Small Finance Bank','Equitas Small Finance Bank','Airtel Payments Bank','India Post Payments Bank'];const icons={Food:'🍔',Family:'👨‍👩‍👧‍👦',Petrol:'⛽',Movies:'🎬',Shopping:'🛍️',Travel:'🚗',Bills:'🧾',Other:'📦'};let data;try{data=JSON.parse(localStorage.getItem('d4webv15')||'{"banks":[],"entries":[]}')}catch(e){data={banks:[],entries:[]}}if(!Array.isArray(data.banks)||!Array.isArray(data.entries))data={banks:[],entries:[]};let view='home';const money=n=>'₹'+Number(n).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem('d4webv15',JSON.stringify(data));show(view)}function show(v){view=v;document.getElementById('total').textContent=money(data.banks.reduce((a,b)=>a+Number(b.balance),0));const el=document.getElementById('screen');if(v==='home'){let sums={};data.entries.filter(e=>e.type==='Expense').forEach(e=>sums[e.category]=(sums[e.category]||0)+e.amount);let items=Object.entries(sums).sort((a,b)=>b[1]-a[1]);el.innerHTML='<h2>Top Spends</h2>'+(items.length?items.slice(0,5).map(([k,n])=>'<div class="card"><div class="row"><b>'+esc(icons[k]||'📦')+' '+esc(k)+'</b><b>'+money(n)+'</b></div><div class="bar"><span style="width:'+Math.round(n/items[0][1]*100)+'%"></span></div></div>').join(''):'<p class="sub">Add a transaction to see top spending categories.</p>')+'<div class="card"><h3>Bank accounts</h3><p>'+data.banks.length+' accounts added</p><button onclick="show(\'banks\')">Manage banks</button></div>'}else if(v==='banks'){el.innerHTML='<div class="row"><h2>My Banks</h2><button onclick="addBank()">+ Add Bank</button></div>'+data.banks.map(b=>'<div class="card row"><div><b>🏦 '+esc(b.name)+'</b><div class="sub">'+esc(b.nick)+'</div><strong>'+money(b.balance)+'</strong></div><button onclick="editBank('+JSON.stringify(b.id)+')">Edit</button></div>').join('')+'<p class="sub">Each account has a separate editable balance. You can add multiple accounts for the same bank.</p>'}else{el.innerHTML='<div class="row"><h2>Transactions</h2><button onclick="addTx()">+ Add</button></div>'+data.entries.slice().reverse().map(e=>'<div class="card"><div class="row"><b>'+esc(icons[e.category]||'📦')+' '+esc(e.category)+'</b><b>'+esc(e.type==='Expense'?'-':'+')+money(e.amount)+'</b></div><div>'+esc(e.note)+'</div><small>'+esc(data.banks.find(b=>b.id===e.bankId)?.name||'Account')+'</small></div>').join('')}}function addBank(){const options=catalogue.map(b=>b+'').join('\n');const name=prompt('Enter bank name (examples: '+catalogue.slice(0,5).join(', ')+'). Bank directory examples:\n'+options);if(!name)return;const nick=prompt('Account nickname (optional)')||'';const amount=prompt('Current existing balance ₹');if(amount===null||amount.trim()===''||!Number.isFinite(Number(amount)))return alert('Enter a valid balance');data.banks.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2),name:name.trim(),nick,balance:Number(amount)});save()}function editBank(id){const b=data.banks.find(x=>x.id===id);if(!b)return;const n=prompt('Edit balance for '+b.name+' ₹',String(b.balance));if(n===null||n.trim()===''||!Number.isFinite(Number(n)))return alert('Invalid balance');b.balance=Number(n);save()}function addTx(){if(!data.banks.length)return alert('Add a bank first');const account=prompt('Choose account number:\n'+data.banks.map((b,i)=>(i+1)+'. '+b.name+' ('+b.nick+')').join('\n'),'1');if(account===null)return;const b=data.banks[Number(account)-1];if(!b)return alert('Invalid account');const type=prompt('Expense or Income?','Expense');if(!['Income','Expense'].includes(type))return;const category=prompt('Category: '+Object.keys(icons).join(', '),'Food');if(!Object.keys(icons).includes(category))return alert('Invalid category');const raw=prompt('Amount ₹');if(raw===null||raw.trim()===''||!Number.isFinite(Number(raw))||Number(raw)<=0)return alert('Invalid amount');const note=prompt('What was this spending for? Notes')||'';const amount=Number(raw);b.balance+=type==='Expense'?-amount:amount;data.entries.push({bankId:b.id,type,category,amount,note,created:new Date().toISOString()});save()}show('home');
</script><script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));}</script></body></html>
