<meta name="apple-mobile-web-app-title" content="D4 DIG UP"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png"><link rel="icon" type="image/svg+xml" href="./icon.svg"><title>D4 DIG UP · iPhone</title>
<style>
:root{--ink:#17213b;--secondary:#6f7894;--accent:#5846e4;--surface:#fff;--bg:#f5f5fd;--line:#ebedfa}
*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg);margin:0;-webkit-tap-highlight-color:transparent}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #99a2fc;outline-offset:2px}.app{max-width:650px;margin:auto;min-height:100vh;padding:env(safe-area-inset-top) 16px calc(98px + env(safe-area-inset-bottom))}header{display:flex;justify-content:space-between;align-items:center;padding:20px 3px 12px}.brand{font-weight:900;font-size:23px;letter-spacing:-.9px}.brand span{font-size:28px;font-style:italic;color:var(--accent)}.subtitle{font-size:11px;color:var(--secondary);margin-top:4px}.buddy{font-size:29px;padding:9px;border-radius:17px;background:#edeafd}.notice{background:#fff5de;color:#755216;font-size:12px;padding:13px 15px;border-radius:15px;line-height:1.5;border:1px solid #f3e6b4;margin:10px 0 16px}.notice strong{display:block;color:#5b4011;margin-bottom:3px}.hero{color:#fff;background:linear-gradient(125deg,#282c9b,#5844d8 62%,#7c65f0);padding:22px;border-radius:24px;box-shadow:0 12px 26px #4533b833;position:relative;overflow:hidden}.hero:after{content:'◌';position:absolute;font-size:190px;color:#fff1;right:-15px;top:-92px;pointer-events:none}.hero small{opacity:.85;font-size:12px}.balance{font-size:34px;font-weight:900;letter-spacing:-1.2px;margin:7px 0 15px;font-variant-numeric:tabular-nums}.hero-footer{font-size:12px;opacity:.84;display:flex;gap:10px;align-items:center}.hero-footer span{padding:7px 10px;border-radius:8px;background:#ffffff20}h2{font-size:19px;letter-spacing:-.4px;margin:23px 0 13px}.card{background:var(--surface);border:1px solid var(--line);border-radius:19px;padding:17px;margin-bottom:12px;box-shadow:0 3px 14px #243d6b08}.row{display:flex;align-items:center;gap:11px;justify-content:space-between}.row>div{min-width:0}.grow{flex:1}.label{font-size:13px;font-weight:750}.muted{font-size:12px;color:var(--secondary);line-height:1.5}.value{font-weight:800;font-variant-numeric:tabular-nums}.button{padding:11px 14px;border-radius:12px;background:var(--accent);color:#fff;font-size:13px;font-weight:750}.button.ghost{background:#eae7ff;color:#4634a7}.mini{font-size:12px;padding:8px 10px;border-radius:10px}.badge-icon{width:42px;height:42px;border-radius:14px;background:#efebff;display:grid;place-items:center;font-size:21px;flex-shrink:0}.bank-symbol{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;color:#fff;font-weight:900;font-size:15px;background:#3150bf;flex-shrink:0}.bar{height:8px;background:#eeeef6;border-radius:99px;margin-top:8px;overflow:hidden}.bar>span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#6851e9,#b093f4)}.bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:0;padding:10px 10px max(9px,env(safe-area-inset-bottom));display:flex;gap:5px;max-width:650px;width:100%;background:#fffffff2;backdrop-filter:blur(15px);border-top:1px solid var(--line);z-index:10}.navbtn{flex:1;border-radius:12px;padding:7px 2px;display:flex;flex-direction:column;align-items:center;gap:4px;background:transparent;color:#8992a6;font-size:10px;font-weight:700}.navbtn.active{background:#ece9ff;color:#513cc4}.navbtn .ico{font-size:22px}.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}.smallstat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:13px}.smallstat .value{display:block;margin-top:7px;font-size:18px}.cashchart{width:100%;height:132px}.empty{text-align:center;padding:32px 15px;color:var(--secondary)}.empty .symbol{font-size:36px;margin-bottom:9px}.empty b{color:var(--ink)}.section-head{display:flex;justify-content:space-between;align-items:center}.section-head h2{margin:20px 0 11px}.bank-card{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:9px;color:inherit}.bank-card .price{margin-left:auto;text-align:right;white-space:nowrap;font-weight:800;font-size:13px}.bank-card small{display:block;font-size:11px;color:var(--secondary);margin-top:4px}.chev{font-size:22px;color:#9498b7}.input{display:block;width:100%;border:1px solid #dfe1ee;border-radius:12px;padding:12px;color:var(--ink);background:#fff;margin:5px 0 14px;font-size:15px}.field{font-size:12px;color:var(--secondary);font-weight:700;display:block;margin-top:10px}textarea.input{min-height:70px;resize:vertical}.sheet-bg{display:none;position:fixed;inset:0;background:#1b17437a;z-index:30;align-items:flex-end;justify-content:center}.sheet-bg.open{display:flex}.sheet{background:#f8f8fe;border-radius:23px 23px 0 0;padding:18px 17px max(24px,env(safe-area-inset-bottom));width:100%;max-width:650px;max-height:88vh;overflow:auto;box-shadow:0 -10px 40px #0002}.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.sheet-head h2{margin:5px 0}.x{font-size:21px;background:#e9e7f4;width:36px;height:36px;border-radius:50%;color:var(--ink)}.listbank{max-height:43vh;overflow:auto;border-radius:12px;background:#fff}.listbank button{display:block;width:100%;padding:13px 12px;background:transparent;color:var(--ink);text-align:left;border-bottom:1px solid #f0f0f6}.pill{background:#efebff;color:#5644b7;font-size:11px;border-radius:999px;padding:6px 9px;display:inline-block}.error{color:#b51e39;font-size:12px;padding:7px 0}.right{text-align:right}.txamount.expense{color:#db3159}.txamount.income{color:#07935b}.status{display:inline-flex;gap:5px;align-items:center}.hidden{display:none!important}
@media(min-width:650px){.app{box-shadow:0 0 40px #2933b40c}}
</style></head><body><div class="app"><header><div><div class="brand"><span>D4</span> DIG UP <small style="font-size:10px;color:#8e86bb">v15</small></div><div class="subtitle">Your personal finance buddy · iPhone</div></div><div class="buddy" aria-hidden="true">🧑‍💼</div></header><main id="view"></main></div><nav class="bottom" id="nav"></nav><div class="sheet-bg" id="overlay" role="presentation"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<script>
'use strict';
// This app is intentionally local-only; no finance data is sent to the public GitHub repository.
const KEY='d4webv15', fmt=n=>'₹'+Number(n).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}), tidy=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const catalog=['State Bank of India','HDFC Bank','ICICI Bank','Axis Bank','Punjab National Bank','Bank of Baroda','Canara Bank','Union Bank of India','Indian Bank','Bank of India','Indian Overseas Bank','UCO Bank','Central Bank of India','Bank of Maharashtra','Punjab & Sind Bank','Kotak Mahindra Bank','Federal Bank','IDFC FIRST Bank','IndusInd Bank','YES BANK','RBL Bank','Bandhan Bank','DCB Bank','City Union Bank','Karur Vysya Bank','Tamilnad Mercantile Bank','South Indian Bank','Karnataka Bank','CSB Bank','Jammu & Kashmir Bank','Nainital Bank','Dhanlaxmi Bank','AU Small Finance Bank','Equitas Small Finance Bank','Ujjivan Small Finance Bank','Utkarsh Small Finance Bank','Suryoday Small Finance Bank','ESAF Small Finance Bank','Jana Small Finance Bank','Shivalik Small Finance Bank','Capital Small Finance Bank','Airtel Payments Bank','India Post Payments Bank','Fino Payments Bank','Jio Payments Bank'];
const cats={Food:['🍔','#fa9e48'],Family:['👨‍👩‍👧','#6d7dff'],Petrol:['⛽','#ef5d62'],Movies:['🎬','#9059d7'],Shopping:['🛍️','#f58ab1'],Travel:['🚗','#54aaf5'],Bills:['🧾','#3dbb97'],Other:['📦','#9295ab']};
const tabs=[['home','⌂','Home'],['banks','▣','Banks'],['transactions','⇄','Transactions'],['plans','◈','Plans'],['settings','⚙','Settings']];
let raw;try{raw=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(_){raw={}}
let data={banks:Array.isArray(raw.banks)?raw.banks:[],entries:Array.isArray(raw.entries)?raw.entries:[],plans:Array.isArray(raw.plans)?raw.plans:[],loans:Array.isArray(raw.loans)?raw.loans:[],source:String(raw.source||''),exportedAt:String(raw.exportedAt||raw.originalSnapshotAt||'')};let tab='home',selectedBank=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert('Device storage is full; export a backup before adding more entries.');}render()}
function total(){return data.banks.reduce((sum,b)=>sum+(Number(b.balance)||0),0)}
function badge(name){const n=String(name||'');let bg=n.includes('Axis')?'#a3134f':n.includes('HDFC')?'#1269bd':n.includes('ICICI')?'#dc6019':n.includes('State Bank')?'#1596d3':n.includes('Canara')?'#00a5cc':n.includes('Punjab')?'#a51c54':n.includes('Baroda')?'#f37927':'#554bc1';let letters=n==='State Bank of India'?'SBI':n.split(/\s+/).map(s=>s[0]).join('').slice(0,3).toUpperCase();return '<div class="bank-symbol" style="background:'+bg+'">'+tidy(letters)+'</div>'}
function categoryIcon(name){return (cats[name]||cats.Other)[0]}
function notice(){if(data.source==='verified-connected-account-google-sheets-snapshot')return '<div class="notice"><strong>✅ Old D4 snapshot restored</strong>Imported from your verified Google Sheets account on '+tidy(data.exportedAt?new Date(data.exportedAt).toLocaleDateString('en-IN'):'an earlier date')+'. This is a one-time local copy, NOT automatic live sync. New entries here will not update Google Sheets.</div>';return '<div class="notice"><strong>ℹ️ Existing D4 records are not synced</strong>Restore your private D4 Import JSON through Settings → Restore Backup to load the original banks, transactions, loans and plans. The app saves locally on your iPhone.</div>'}
function home(){const groups={};for(const e of data.entries){if(e.type==='Expense'){const key=e.category||'Other';groups[key]=(groups[key]||0)+Number(e.amount||0)}}const top=Object.entries(groups).sort((a,b)=>b[1]-a[1]);const hasBank=data.banks.length>0;const now=new Date();const first=new Date(now.getFullYear(),now.getMonth(),1);const thisMonth=data.entries.filter(e=>new Date(e.created||e.when||0)>=first);const inc=thisMonth.filter(e=>e.type==='Income').reduce((s,e)=>s+Number(e.amount||0),0),exp=thisMonth.filter(e=>e.type==='Expense').reduce((s,e)=>s+Number(e.amount||0),0);let html=notice()+'<div class="hero"><small>🏦 TOTAL BANK BALANCE</small><div class="balance">'+(hasBank?fmt(total()):'Not connected')+'</div><div class="hero-footer"><span>'+data.banks.length+' accounts</span><span>Manual tracking</span></div></div><div class="split" style="margin:12px 0"><div class="smallstat"><div class="muted">↙ Income · This month</div><strong class="value" style="color:#08945a">'+fmt(inc)+'</strong></div><div class="smallstat"><div class="muted">↗ Expense · This month</div><strong class="value" style="color:#df3e62">'+fmt(exp)+'</strong></div></div>';
html+='<div class="section-head"><h2>Monthly Cash Flow</h2><span class="pill">Last 6 months</span></div><div class="card">'+chart()+'</div><div class="section-head"><h2>🏆 Top Spends</h2><span class="pill">Categories</span></div>';
if(!top.length)html+='<div class="card empty"><div class="symbol">📊</div><b>No spending yet</b><p class="muted">Add transactions to see your top spending categories.</p><button class="button" onclick="openTransaction()">+ Add Transaction</button></div>';
else html+='<div class="card">'+top.slice(0,5).map(([k,n])=>'<div style="margin-bottom:17px"><div class="row"><div class="label">'+categoryIcon(k)+' '+tidy(k)+'</div><div class="value" style="font-size:13px">'+fmt(n)+'</div></div><div class="bar"><span style="width:'+Math.round(n/top[0][1]*100)+'%"></span></div></div>').join('')+'</div>';
html+='<div class="split"><button class="card" style="text-align:left;color:var(--ink)" onclick="go(\'banks\')">🏦 <b>My Banks</b><div class="muted">Manage accounts</div></button><button class="card" style="text-align:left;color:var(--ink)" onclick="go(\'transactions\')">🧾 <b>Transactions</b><div class="muted">History & notes</div></button></div>';return html}
function chart(){const entries=data.entries.filter(e=>e.created||e.when);if(!entries.length)return '<div class="empty" style="padding:25px 0">📈<p class="muted">Cash-flow graph appears after adding transactions.</p></div>';const today=new Date(),months=Array.from({length:6},(_,i)=>{const d=new Date(today.getFullYear(),today.getMonth()-5+i,1);return {y:d.getFullYear(),m:d.getMonth(),label:d.toLocaleString('en',{month:'short'}),income:0,expense:0}});for(const e of entries){const d=new Date(e.created||e.when);const m=months.find(x=>x.y===d.getFullYear()&&x.m===d.getMonth());if(m){if(e.type==='Income')m.income+=Number(e.amount||0);else if(e.type==='Expense')m.expense+=Number(e.amount||0)}}const max=Math.max(1,...months.flatMap(m=>[m.income,m.expense]));const line=key=>months.map((m,i)=>(18+i*55)+','+(110-m[key]/max*88)).join(' ');return '<div class="muted">Income <b style="color:#159d71">●</b> &nbsp; Expenses <b style="color:#ef5377">●</b></div><svg class="cashchart" viewBox="0 0 315 135" preserveAspectRatio="none" aria-label="Monthly income and expense graph"><path d="M16 110 H305 M16 67 H305 M16 23 H305" stroke="#eceaf8" stroke-width="1" fill="none"/><polyline points="'+line('income')+'" fill="none" stroke="#17a878" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="'+line('expense')+'" fill="none" stroke="#ee527d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>'+months.map((m,i)=>'<text x="'+(18+i*55)+'" y="130" text-anchor="middle" fill="#9298a9" font-size="10">'+m.label+'</text>').join('')+'</svg>'}
function banksPage(){let out='<div class="section-head"><h2>🏦 My Banks</h2><button class="button" onclick="openBankPicker()">+ Add Bank</button></div><div class="hero"><small>TOTAL MANUALLY ENTERED BALANCE</small><div class="balance">'+(data.banks.length?fmt(total()):'Not set')+'</div><div class="hero-footer">'+data.banks.length+' accounts · Multiple accounts per bank supported</div></div>';if(!data.banks.length)return out+'<div class="card empty"><div class="symbol">🏛️</div><b>No banks added here yet</b><p class="muted">Your older bank records are still in the original D4 database.</p><button class="button" onclick="openBankPicker()">Choose Bank</button></div>';return out+'<h2>Bank Accounts</h2>'+data.banks.map(b=>'<button type="button" class="bank-card" data-bank-id="'+tidy(String(b.id))+'">'+badge(b.name)+'<div class="grow"><div class="label">'+tidy(b.name)+'</div><small>'+tidy(b.nick||'Account')+'</small></div><div class="price">'+fmt(b.balance)+'</div><span class="chev">›</span></button>').join('')}
function history(){let out='<div class="section-head"><h2>⇄ Transactions</h2><button class="button" onclick="openTransaction()">+ Add</button></div><div class="muted" style="margin:0 0 12px">Food, Family, Petrol, Movies and custom spending notes.</div>';if(!data.entries.length)return out+'<div class="card empty">🧾<p><b>No local history yet</b></p><p class="muted">Your old Google Sheets transactions do not automatically appear here.</p></div>';return out+data.entries.slice().reverse().map(e=>{const b=data.banks.find(b=>String(b.id)===String(e.bankId));return '<div class="card row"><div class="badge-icon">'+categoryIcon(e.category)+'</div><div class="grow"><div class="label">'+tidy(e.category)+'</div><div class="muted">'+tidy(e.note||'No note')+'</div><div class="muted">'+tidy(e.type==='Transfer'?(e.fromBank+' → '+e.toBank):(b?.name||e.bank||'Unassigned original entry'))+'</div></div><div class="right"><div class="value txamount '+(e.type==='Expense'?'expense':e.type==='Transfer'?'':'income')+'">'+(e.type==='Expense'?'−':e.type==='Transfer'?'⇄':'+')+fmt(e.amount)+'</div><div class="muted">'+tidy(new Date(e.created||e.when||Date.now()).toLocaleDateString('en-IN'))+'</div></div></div>'}).join('')}
function plans(){const ps=Array.isArray(data.plans)?data.plans:[],ls=Array.isArray(data.loans)?data.loans:[];let h='<h2>🎯 Future Plans & Loans</h2>';if(!ps.length&&!ls.length)return h+'<div class="card empty">No plans or loans here yet. Import the private D4 backup through Settings if you have one.</div>';if(ps.length){h+='<h3>Future Plans</h3>';h+=ps.map(p=>'<div class="card"><strong>'+tidy(p.name)+'</strong><p>Target: <b>'+fmt(p.target||0)+'</b> · Saved: '+fmt(p.saved||0)+'</p>'+(p.actualSpent?'<p>Spent: '+fmt(p.actualSpent)+'</p>':'')+(p.dueDate?'<div class="muted">Target date: '+tidy(String(p.dueDate).slice(0,10))+'</div>':'')+'</div>').join('')}if(ls.length){h+='<h3>Loans & EMI</h3>';h+=ls.map(l=>{const paid=(l.payments||[]).reduce((s,p)=>s+Number(p.amount||0),0);return '<div class="card"><strong>🪙 '+tidy(l.name)+'</strong><div class="muted">'+tidy(l.lender||'Loan')+'</div><p>Original principal: <b>'+fmt(l.principal||0)+'</b></p><p>EMI: <b>'+fmt(l.emi||0)+'</b> · Payments recorded: '+fmt(paid)+'</p><div class="muted">Current outstanding requires loan-interest recalculation; imported values are reference only.</div></div>'}).join('')}return h+'<p class="muted">Imported plans and loans are a snapshot. Paying an EMI here does not send money or update your original Google Sheet.</p>'}
function settings(){return '<h2>⚙ Settings & Backup</h2><div class="card"><b>Your data stays on this device</b><p class="muted">This public GitHub Pages site stores bank balances and transactions locally in this Safari browser, not in your Google Sheet. Clearing Safari site data can erase local entries.</p><div class="row"><button class="button" onclick="exportBackup()">↓ Download Backup</button><button class="button ghost" onclick="document.getElementById(\'restore\').click()">↑ Import Old D4 Data</button></div><input type="file" id="restore" accept=".json,application/json" class="hidden" onchange="importBackup(this)"><p class="muted">Restore supports the private D4 iPhone Import JSON from this chat as well as Safari backups. Raw spreadsheet exports are not supported.</p></div><div class="notice"><strong>Original D4 finance account</strong>Your older balances and history are on a separate Google Sheets-backed app. Use your previous D4 DIG UP login to access them; this iPhone quick-start is not a replacement database.</div><div class="card"><b>Bank logos</b><p class="muted">Colour-coded bank initials are placeholders. Official logo assets are not connected yet.</p></div>'}
function go(next){tab=next;selectedBank=null;closeSheet();render();window.scrollTo({top:0,behavior:'instant'})}
function render(){document.getElementById('nav').innerHTML=tabs.map(([id,ic,label])=>'<button type="button" class="navbtn '+(id===tab?'active':'')+'" data-tab="'+tidy(id)+'"><span class="ico">'+ic+'</span>'+label+'</button>').join('');let html=tab==='home'?home():tab==='banks'?banksPage():tab==='transactions'?history():tab==='plans'?plans():settings();document.getElementById('view').innerHTML=html}
function showSheet(title,inner){document.getElementById('sheet').innerHTML='<div class="sheet-head"><h2>'+tidy(title)+'</h2><button class="x" aria-label="Close" onclick="closeSheet()">×</button></div>'+inner;document.getElementById('overlay').classList.add('open')}
function closeSheet(){document.getElementById('overlay').classList.remove('open')}
function openBankPicker(){showSheet('Choose a Bank','<p class="muted">Search Indian banks. You can add unlimited accounts, including multiple accounts with the same bank.</p><input class="input" id="banksearch" placeholder="Search bank name" oninput="filterBankList(this.value)"><div class="listbank" id="banklist"></div><button class="button ghost" style="width:100%;margin-top:10px" onclick="chooseBank(\'Other Bank\')">My bank is not listed</button>');filterBankList('')}
function filterBankList(q){const items=catalog.filter(b=>b.toLowerCase().includes(q.trim().toLowerCase()));document.getElementById('banklist').innerHTML=items.map(b=>'<button type="button" data-bank-choice="'+tidy(b)+'">🏦 '+tidy(b)+'</button>').join('')||'<div class="empty">No matching bank. Choose “My bank is not listed”.</div>'}
function chooseBank(name){showSheet('Add Bank Account','<form id="addbank"><label class="field">Bank Name</label><input class="input" id="bankname" required maxlength="100" value="'+tidy(name==='Other Bank'?'':name)+'" placeholder="Bank name"><label class="field">Account nickname</label><input class="input" id="banknick" maxlength="70" placeholder="e.g. Salary account"><label class="field">Current existing balance (₹)</label><input class="input" id="bankbalance" type="number" step="0.01" required placeholder="Enter manually"><button class="button" type="submit" style="width:100%">Save Account</button></form>');document.getElementById('addbank').onsubmit=e=>{e.preventDefault();const b=document.getElementById('bankname').value.trim(),n=document.getElementById('banknick').value.trim(),v=Number(document.getElementById('bankbalance').value);if(!b||!Number.isFinite(v))return alert('Enter valid bank and balance');data.banks.push({id:String(Date.now())+'-'+Math.random().toString(36).slice(2),name:b,nick:n,balance:v});closeSheet();tab='banks';save()}}
function openBankDetail(id){const b=data.banks.find(b=>String(b.id)===String(id));if(!b)return;let own=data.entries.filter(e=>String(e.bankId)===String(id));showSheet(b.name,'<div class="hero"><small>THIS ACCOUNT ONLY</small><div class="balance">'+fmt(b.balance)+'</div><small>'+tidy(b.nick||'Account')+'</small></div><h2>Edit Existing Balance</h2><form id="editbank"><label class="field">New current balance (₹)</label><input class="input" type="number" step="0.01" required id="newbalance" value="'+Number(b.balance)+'"><button class="button" type="submit">Update this account</button></form><h2>Account Transactions</h2>'+(own.length?own.slice().reverse().map(e=>'<div class="card row"><div>'+categoryIcon(e.category)+' '+tidy(e.category)+'<div class="muted">'+tidy(e.note||'No note')+'</div></div><b>'+fmt(e.amount)+'</b></div>').join(''):'<p class="muted">No transactions recorded for this account.</p>'));document.getElementById('editbank').onsubmit=e=>{e.preventDefault();const val=Number(document.getElementById('newbalance').value);if(!Number.isFinite(val))return alert('Invalid amount');b.balance=val;closeSheet();save()}}
function openTransaction(){if(!data.banks.length){alert('Add a bank account first. Old data is not synced here.');go('banks');return;}showSheet('Add Transaction','<form id="txform"><label class="field">Bank Account</label><select class="input" id="txbank">'+data.banks.map(b=>'<option value="'+tidy(String(b.id))+'">'+tidy(b.name+' — '+(b.nick||'Account'))+'</option>').join('')+'</select><label class="field">Transaction Type</label><select class="input" id="txtype"><option>Expense</option><option>Income</option></select><label class="field">For what?</label><select class="input" id="txcat">'+Object.keys(cats).map(k=>'<option value="'+tidy(k)+'">'+categoryIcon(k)+' '+tidy(k)+'</option>').join('')+'</select><label class="field">Amount (₹)</label><input class="input" type="number" id="txamount" min="0.01" step="0.01" placeholder="Amount" required><label class="field">Notes · What did you spend on?</label><textarea class="input" id="txnote" maxlength="500" placeholder="e.g. Lunch with family"></textarea><button class="button" type="submit" style="width:100%">Save Transaction</button></form>');document.getElementById('txform').onsubmit=e=>{e.preventDefault();const id=document.getElementById('txbank').value,b=data.banks.find(b=>String(b.id)===id),amount=Number(document.getElementById('txamount').value),type=document.getElementById('txtype').value,category=document.getElementById('txcat').value,note=document.getElementById('txnote').value.trim();if(!b||!Number.isFinite(amount)||amount<=0)return alert('Invalid transaction');b.balance=Number(b.balance)+(type==='Expense'?-amount:amount);data.entries.push({bankId:b.id,type,amount,category,note,created:new Date().toISOString()});closeSheet();tab='transactions';save()}}
function exportBackup(){const json=JSON.stringify({format:'d4webv15',version:2,exportedAt:new Date().toISOString(),banks:data.banks,entries:data.entries,plans:data.plans,loans:data.loans,source:data.source,originalSnapshotAt:data.exportedAt},null,2);const url=URL.createObjectURL(new Blob([json],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='D4-DIG-UP-iPhone-Backup.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}
async function importBackup(input){const file=input.files?.[0];if(!file)return;try{if(file.size>5e6)throw Error('Backup exceeds 5 MB');const parsed=JSON.parse(await file.text());if(parsed.format!=='d4webv15'||!Array.isArray(parsed.banks)||!Array.isArray(parsed.entries))throw Error('Not a compatible D4 import file');const newBanks=parsed.banks.map(b=>({id:String(b.id),name:String(b.name),nick:String(b.nick||''),balance:Number(b.balance)}));const newEntries=parsed.entries.map(e=>({...e,bankId:String(e.bankId||''),amount:Number(e.amount)}));if(newBanks.some(b=>!b.id||!b.name||!Number.isFinite(b.balance))||newEntries.some(e=>!Number.isFinite(e.amount)||e.amount<0))throw Error('Invalid values in backup');if(data.banks.length||data.entries.length){if(!confirm('This will REPLACE your current local iPhone banks and transactions. Download a Backup in Settings first if you want to preserve them. The old Google Sheets data will not change. Continue?'))return;}else if(!confirm('Restore '+newBanks.length+' original banks and '+newEntries.length+' transactions on this iPhone? Your Google Sheet will not change.'))return;data={banks:newBanks,entries:newEntries,plans:Array.isArray(parsed.plans)?parsed.plans:[],loans:Array.isArray(parsed.loans)?parsed.loans:[],source:String(parsed.source||''),exportedAt:String(parsed.exportedAt||parsed.originalSnapshotAt||'')};save();alert('Restored '+newBanks.length+' banks, '+newEntries.length+' transactions, '+data.loans.length+' loans and '+data.plans.length+' plans. This is a local snapshot, not live sync.')}catch(e){alert('Could not restore: '+e.message)}finally{input.value=''}}

// Stable click handlers: avoid broken quoted inline handlers for dynamically named items.
document.getElementById('nav').addEventListener('click',e=>{const target=e.target.closest('[data-tab]');if(target){e.preventDefault();go(target.dataset.tab)}});
document.getElementById('view').addEventListener('click',e=>{const target=e.target.closest('[data-bank-id]');if(target){e.preventDefault();openBankDetail(target.dataset.bankId)}});
document.getElementById('sheet').addEventListener('click',e=>{const target=e.target.closest('[data-bank-choice]');if(target){e.preventDefault();chooseBank(target.dataset.bankChoice)}});
document.getElementById('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeSheet()});render();
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}))}
</script></body></html>
